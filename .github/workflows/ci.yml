name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run content
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Lighthouse (přístupnost a výkon)
        run: |
          npm run preview &
          npx --yes wait-on http://localhost:4173
          npx --yes lighthouse http://localhost:4173 --only-categories=accessibility,performance,best-practices \
            --chrome-flags="--headless=new --no-sandbox" --output=json --output-path=lighthouse.json --quiet
          node -e "const r=require('./lighthouse.json');const a=r.categories.accessibility.score*100;console.log('accessibility',a);if(a<90)process.exit(1)"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
