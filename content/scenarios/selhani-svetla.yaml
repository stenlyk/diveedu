id: selhani-svetla
title: Selhání hlavní svítilny
summary: Hlavní světlo zhasne za hranicí denního světla. Jde o pořadí kroků a o to, co znamená záloha.
moduleIds: [cavern]
conceptIds: [selhani-svetla, tri-svetla, svetelne-signaly]
intro: >-
  Dvoučlenný tým plave po hlavní šňůře v 15 m, asi 200 m za hranicí denního světla. Plaveš druhý.
  Scénář je cvičení rozhodování, ne náhrada výcviku.
setup: { startBar: 150, tankLiters: 24, depthM: 15, sacLpm: 18 }
start: start
nodes:
  - id: start
    text: >-
      Hlavní svítilna dvakrát blikne a zhasne. Vidíš jen vzdalující se kužel partnera před sebou.
    darkness: dim
    timeLimitSec: 12
    timeout: { next: zalozni, minutes: 1, stress: 1.5, feedback: 'Váhání ve tmě zrychluje dech. Rozsvítit záložní světlo má být reflex.' }
    options:
      - { text: 'Zastavím a rozsvítím záložní světlo.', next: zalozni, minutes: 1, verdict: good, feedback: 'Nejdřív obnov vlastní světlo. Všechno ostatní počká.' }
      - { text: 'Zkusím hlavní svítilnu opravit – vypínač, konektor.', next: oprava, minutes: 3, verdict: bad, feedback: 'Opravovat potmě, zatímco partner odplouvá, je špatné pořadí. Nejdřív světlo, pak signál.' }
      - { text: 'Doplavu k partnerovi, jeho světlo stačí oběma.', next: bez-svetla, minutes: 1, verdict: bad, feedback: 'V cizím kuželu jsi závislý na tom, kam partner zrovna svítí.' }
  - id: zalozni
    text: >-
      Záložní světlo svítí. Partner je pět metrů před tebou a o ničem neví.
    options:
      - { text: 'Pomalým pohybem světla ze strany na stranu upoutám jeho pozornost, ukážu zhaslou svítilnu a signál otočky.', next: otocka, minutes: 1, verdict: good, feedback: 'Signál „pozor“, sdělení problému a otočka. Na záložní světlo se dovnitř nepokračuje.' }
      - { text: 'Rychle mávám světlem.', next: otocka, minutes: 1, verdict: ok, feedback: 'Partner zareaguje, ale rychlé mávání znamená nouzi. Tohle je porucha, ne nouze – stačí signál „pozor“.' }
      - { text: 'Nic neříkám, záložní světlo stačí. Pokračujeme.', next: pokracuje, minutes: 5, verdict: bad, feedback: 'Tým neví, že jsi přišel o zálohu. Další porucha tě nechá s posledním světlem daleko od vchodu.' }
  - id: otocka
    text: >-
      Partner potvrdil otočku. V jakém pořadí poplavete ven?
    options:
      - { text: 'Já vpředu, partner s plným světlem za mnou.', next: cesta, minutes: 6, verdict: good, feedback: 'Potápěč s problémem plave tam, kde na něj partner vidí.' }
      - { text: 'Partner vpředu, já za ním.', next: cesta, minutes: 6, verdict: ok, feedback: 'Kdyby ti zhaslo i záložní světlo, partner si toho všimne pozdě.' }
  - id: cesta
    text: >-
      V polovině cesty záložní světlo znatelně zeslábne. Baterie dochází.
    darkness: dim
    timeLimitSec: 12
    timeout: { next: tma, minutes: 1, stress: 1.5, feedback: 'Světlo zhaslo dřív, než ses rozhodl.' }
    options:
      - { text: 'Rozsvítím druhé záložní světlo hned a dám partnerovi vědět.', next: vychod, minutes: 1, verdict: good, feedback: 'Záloha se zapíná, dokud ještě vidíš, ne až ve tmě.' }
      - { text: 'Nechám ho dosvítit, druhé šetřím.', next: tma, minutes: 2, verdict: bad, feedback: 'Zhasne ve chvíli, kterou si nevybereš – třeba v zúžení.' }
  - id: tma
    text: >-
      Světlo zhaslo právě v zúžení. Úplná tma, partner je za ohybem chodby.
    darkness: black
    options:
      - { text: 'Zastavím, najdu rukou šňůru a rozsvítím druhé záložní světlo.', next: vychod, minutes: 2, stress: 1.5, verdict: good, feedback: 'Zastavit, šňůra, světlo. Ve tmě se neplave.' }
      - { text: 'Plavu dál po paměti, zúžení je krátké.', next: konec, minutes: 6, stress: 2, verdict: bad, feedback: 'Bez světla a bez ruky na šňůře stačí pár temp a nevíš, kde šňůra je.' }
  - id: oprava
    text: >-
      Tři minuty marných pokusů. Kužel partnerova světla je už jen slabý odlesk v dálce.
    darkness: dim
    options:
      - { text: 'Nechám svítilnu být a rozsvítím záložní světlo.', next: zalozni, minutes: 1, verdict: good, feedback: 'Opravy patří na hladinu.' }
      - { text: 'Plavu za partnerem potmě.', next: bez-svetla, minutes: 1, stress: 1.5, verdict: bad, feedback: 'Máš u sebe dvě funkční světla a nepoužíváš je.' }
  - id: bez-svetla
    text: >-
      Plaveš za partnerovým světlem. Zahne za ohyb chodby a kolem tebe je tma.
    darkness: black
    options:
      - { text: 'Zastavím a rozsvítím záložní světlo.', next: zalozni, minutes: 1, stress: 1.3, verdict: good, feedback: 'Tohle měl být první krok.' }
      - { text: 'Zrychlím, abych ho dohnal.', next: konec, minutes: 4, stress: 2, verdict: bad, feedback: 'Potmě a ve spěchu se šňůra ztrácí nejsnáz.' }
  - id: pokracuje
    text: >-
      O pět minut dál. Malé světlo ukazuje chodbu hůř, šňůru sotva rozeznáš. A je to jedno ze dvou, která ti zbývají.
    options:
      - { text: 'Dám signál otočky teď.', next: otocka, minutes: 1, verdict: good, feedback: 'Pozdě, ale správně. Každé selhání, které spotřebuje zálohu, ukončuje ponor.' }
      - { text: 'Pokračuji až do tlaku otočky.', next: cesta, minutes: 10, verdict: bad, feedback: 'Záložní světla jsou počítaná na cestu ven, ne na pokračování ponoru.' }
  - id: vychod
    text: >-
      Před tebou se objeví modré denní světlo vchodu.
    options:
      - { text: 'Dokončím výstup podle plánu. Svítilnu nepoužiji, dokud nezjistím příčinu.', next: uspech, minutes: 8, verdict: good, feedback: 'Porucha, která nemá vysvětlení, se zopakuje.' }
      - { text: 'Nejspíš jen baterie. Zítra jdu znovu se stejnou výstrojí.', next: castecne, minutes: 8, verdict: ok, feedback: 'Ven ses dostal správně. Výstroj s neobjasněnou poruchou ale do jeskyně nepatří – a jedno záložní světlo má vybitou baterii.' }
  - id: uspech
    text: Hladina.
    end: { outcome: success, text: 'Porucha světla skončila tak, jak má: otočkou a klidným návratem. Zálohy fungovaly, protože jsi je použil včas a tým o problému věděl.' }
  - id: castecne
    text: Hladina.
    end: { outcome: partial, text: 'Ponor dopadl dobře. Rozbor ale ukazuje místa, kde jsi spoléhal na štěstí.' }
  - id: konec
    text: Ve tmě jsi ztratil kontakt se šňůrou.
    end: { outcome: fail, text: 'Scénář končí. Z poruchy světla se stala ztráta šňůry ve tmě – přitom jsi měl u sebe funkční světlo. Projdi si rozbor.' }
sources:
  - { title: NSS Cave Diving Manual, author: 'Prosser J., Grey H. V. (eds.), National Speleological Society Cave Diving Section', year: 1992 }
  - { title: TDI Cavern and Intro to Cave Diver Manual, author: Technical Diving International }
needs_review: true
