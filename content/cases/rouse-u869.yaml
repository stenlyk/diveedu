id: rouse-u869
title: 'Vrak U-869: hluboký vrakový ponor na vzduch'
year: 1992
location: 'Atlantik u pobřeží New Jersey, USA'
rig: oc
moduleIds: [trimix, deko]
anonymized: false
context: >-
  V říjnu 1992 se zkušení vrakoví potápěči Chris Rouse a jeho syn Chris „Chrissy“ Rouse potápěli na tehdy neidentifikované německé ponorce
  ležící v hloubce kolem 70 metrů. Trimix se v té době mezi vrakovými potápěči teprve prosazoval a byl drahý; ponor proběhl na vzduchu.
  Oba měli zkušenosti s jeskynním i vrakovým potápěním. Případ podrobně popisuje kniha Bernieho Chowdhuryho The Last Dive.
  Uvádíme průběh tak, jak ho popisují publikované zdroje; přesné časy, hloubky a detaily výstroje je třeba ověřit.
profile: []
timeline:
  - { when: Průnik do vraku, what: 'Mladší z dvojice vplouvá do nitra vraku a hledá předměty, které by ponorku identifikovaly. Starší čeká u vstupu.' }
  - { when: Uvnitř, what: 'Na potápěče se sesune část vybavení vraku a uvězní ho. Viditelnost klesne na nulu.' }
  - { when: Vyproštění, what: 'Otec vplouvá dovnitř a syna vyprostí. Zabere to čas i plyn; oba jsou daleko za plánovaným časem na dně.' }
  - { when: Před výstupem, what: 'Potápěči nenajdou své odložené lahve s plynem na dekompresi.' }
  - { when: Výstup, what: 'Vystoupají na hladinu bez dekomprese, přestože měli povinnost dlouhých zastávek.' }
  - { when: Na hladině, what: 'Oba mají těžké příznaky dekompresní nemoci. Otec umírá krátce po vytažení, syn později během léčby v komoře.' }
errorChain:
  - { layer: planovani, description: 'Průnik do vraku v 70 m plánovaný na vzduch; dekompresní lahve odložené mimo vrak, bez záložní varianty.', conceptIds: [hluboky-vzduch, plan-ponoru] }
  - { layer: plyn, description: 'Vzduch v této hloubce znamená těžkou narkózu, hustotu plynu daleko nad limitem a ppO2 nad pracovním limitem.', conceptIds: [dusikova-narkoza, limit-hustoty, ppo2] }
  - { layer: vybaveni, description: 'Dekompresní plyn nebyl u potápěčů, ale odložený; po ztrátě orientace ho nenašli.', conceptIds: [stage-lahev, ztrata-deko-plynu] }
  - { layer: prostredi, description: 'Stísněný prostor vraku, uvolněné vybavení, zvířený sediment a nulová viditelnost.', conceptIds: [hloubka] }
  - { layer: lidsky-faktor, description: 'Námaha a stres při vyprošťování na hustém plynu; pod narkózou a s vysokým CO2 se rozhoduje nejhůř právě ve chvíli, kdy na rozhodnutí záleží nejvíc.', conceptIds: [retence-co2, namaha, vynechana-dekomprese] }
physiology: >-
  Pravděpodobný mechanismus (hypotéza opřená o publikovaný popis): narkóza na vzduchu v 70 m výrazně zhoršila úsudek a orientaci.
  Těžká práce při vyprošťování v plynu o hustotě kolem deseti gramů na litr vedla k hromadění CO2, které narkózu dál zesílilo.
  Dlouhý pobyt nasytil tkáně dusíkem tak, že bezpečný výstup vyžadoval desítky minut dekomprese. Přímý výstup znamenal přesycení mnohonásobně nad limity modelu
  a masivní tvorbu bublin. Co přesně rozhodlo o tom, že dekompresní lahve nenašli, se už nedá zjistit.
