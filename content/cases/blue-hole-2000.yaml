  - { title: 'Respiratory physiology of rebreather diving. In: Rebreathers and Scientific Diving', author: 'Anthony G., Mitchell S. J.', year: 2016, note: 'Limity hustoty plynu.' }
  - { title: 'NOAA Diving Manual, 6th Edition', author: NOAA, year: 2017 }
certainty: hypotéza
needs_review: true
