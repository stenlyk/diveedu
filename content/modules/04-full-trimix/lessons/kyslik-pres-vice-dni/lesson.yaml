id: kyslik-pres-vice-dni
moduleId: fulltrimix
title: "Kyslík přes více dní"
order: 7
conceptIds: ["kyslik-vice-dni", "vzduchove-prestavky", "vzorec-otu", "vzorec-cns", "plicni-toxicita"]
checkQuestionIds: ["vicedni-limit", "vicedni-otu-vypocet", "vicedni-prestavky", "vicedni-rezerva", "vicedni-cns-vs-otu", "prestavky-jak"]
estimatedMinutes: 10
audioSummary: >-
  U jednoho ponoru rozhoduje rychlá kyslíková toxicita, tedy CNS. U série dlouhých ponorů začínají rozhodovat plíce.
  Plicní zátěž se měří v jednotkách ó té ú a sčítá se přes dny.
  Limit na den klesá s délkou série. Pro jeden den osm set padesát, pro deset dní kolem tří set.
  Část limitu si vždy nech. Případná léčba v komoře je stovky jednotek.
  Hodina kyslíku v šesti metrech přesáhne limit CNS pro jednu expozici.
  Proto se při dlouhé dekompresi dělají přestávky na plynu s nižším parciálním tlakem kyslíku.
  Pálení za hrudní kostí a suchý kašel jsou signál kyslík ubrat.
sources:
