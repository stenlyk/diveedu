audioSummary: >-
  Hluboké zastávky jsou zastávky hlouběji, než předepisuje klasický model.
  V devadesátých letech se rozšířily z osobní zkušenosti a z teorie bublinových modelů.
  Jejich háček je, že v hloubce pomalé tkáně plyn stále přijímají.
  Pokus amerického námořnictva z roku dva tisíce jedenáct srovnal dva rozvrhy se stejnou celkovou dobou. Ten s hlubokými zastávkami měl víc případů dekompresní nemoci.
  Neplyne z toho, že se má stoupat rovnou k hladině. Řízený výstup a zastávky podle modelu platí dál.
  Praxe se posunula k vyššímu gé ef low, například padesát osmdesát.
  Pocit po ponoru ani elegantní teorie nejsou důkaz. Důkaz je pokus.
sources:
