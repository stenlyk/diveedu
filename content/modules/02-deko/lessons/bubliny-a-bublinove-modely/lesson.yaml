audioSummary: >-
  Bubliny vznikají v žilní krvi po většině ponorů, i když nemáš žádné příznaky. Říká se jim tiché bubliny a plíce je odfiltrují.
  Dekompresní nemoc je otázka toho, kolik bublin vznikne, jak jsou velké a kde.
  Modely rozpuštěného plynu, jako je Bühlmannův, hlídají přesycení tkání.
  Bublinové modely, jako vé pé em a er gé bé em, se snaží omezit růst bublin hlubšími zastávkami.
  Přímé srovnání amerického námořnictva z roku dva tisíce jedenáct ale hlubokým zastávkám za pravdu nedalo. Debata pokračuje.
  Množství bublin nejvíc ovlivníš sám. Pomalým výstupem, dodržením zastávek, klidem po ponoru, tekutinami a teplem.
