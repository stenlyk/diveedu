title: "Barotraumata a arteriální plynová embolie"
order: 4
conceptIds: ["barotrauma-plic", "plynova-embolie", "pneumotorax", "barotrauma-dutin"]
checkQuestionIds: ["baro-plice-proc", "baro-melko", "baro-age-priznaky", "baro-dutiny", "baro-objem"]
estimatedMinutes: 11
audioSummary: >-
  Barotrauma je poranění rozdílem tlaků. Týká se uší, nosních dutin, masky, obleku i zubů.
  Nejnebezpečnější je poranění plic při výstupu se zadrženým dechem. Plyn může proniknout do tepen a do mozku. To je arteriální plynová embolie.
  Přichází během minut po vynoření a vypadá jako mrtvice.
  Největší poměrná změna objemu je u hladiny. Výstup se zadrženým dechem ze dvou metrů může stačit.
  První pomoc je stejná jako u dekompresní nemoci. Kyslík, poloha vleže, záchranná služba a rekompresní komora.
