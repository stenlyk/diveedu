id: pfo-a-zkrat
moduleId: fyziologie
title: "Otevřené foramen ovale a zkrat v srdci"
order: 2
conceptIds: ["pfo", "konzervativni-profil", "bubliny"]
checkQuestionIds: ["pfo-co-je", "pfo-proc-vadi", "pfo-kdy-otevre", "pfo-moznosti", "pfo-gf"]
estimatedMinutes: 10
audioSummary: >-
  Mezi pravou a levou síní srdce je před narozením otvor. Asi u čtvrtiny dospělých se úplně neuzavře.
  Bubliny v žilní krvi normálně zachytí plíce. Otevřeným foramen ovale mohou část bublin obejít plíce a dostat se do tepen, do mozku, míchy, ucha nebo kůže.
  Chlopeň se otevře při tlačení, kašli a námaze, zvlášť těsně po ponoru.
  Plošné vyšetřování se nedoporučuje. Po zjištění se rozhoduje s lékařem mezi konzervativním potápěním, uzavřením a koncem potápění.
  Konzervativní profil znamená méně bublin a je rozumný pro každého.
sources:
