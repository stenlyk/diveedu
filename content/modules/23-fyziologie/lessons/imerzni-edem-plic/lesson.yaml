audioSummary: >-
  Imerzní edém plic znamená, že z plicních vlásečnic prosakuje tekutina do sklípků. Vzniká během ponoření, bez souvislosti s dekompresí.
  Přispívá k němu přesun krve do hrudníku, chlad, námaha a odpor při nádechu.
  Ohroženi jsou lidé s vysokým tlakem a nemocí srdce, starší potápěči a ti, kdo ho už měli. Ale i mladí sportovci.
  Projevuje se dušností, kašlem, někdy růžovým pěnivým hlenem. Snadno se splete s panikou.
  Ukončit ponor, ven z vody, posadit, kyslík a lékař. I když se stav zlepší.
