checkQuestionIds: ["he-oblek", "he-teplo-dech", "he-hpns", "he-vlastnosti", "argon-proc", "hpns-kdy"]
estimatedMinutes: 9
audioSummary: >-
  Helium má kromě nízké hustoty další vlastnosti, se kterými musíš počítat.
  Vede teplo asi šestkrát lépe než vzduch. Suchý oblek se proto trimixem nikdy neplní.
  Používá se vzduch nebo argon ze samostatné lahve.
  Ztráty tepla dechem jsou v hloubce velké u každého plynu, protože dýcháš plyn několikrát hustší než na hladině.
  Helium mění hlas a uniká i drobnými netěsnostmi.
  Při rychlém sestupu hlouběji než asi sto padesát metrů hrozí nervový syndrom vysokého tlaku. V rozsahu normoxického trimixu se neprojeví.
  A helium je drahé. Proto ho neber víc, než je potřeba.
