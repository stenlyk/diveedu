checkQuestionIds: ["dekohe-rychlost", "dekohe-proc-deko-plyn", "dekohe-model", "dekohe-vystup"]
estimatedMinutes: 11
audioSummary: >-
  Helium se v tkáních sytí i vysycuje asi dvaapůlkrát rychleji než dusík.
  Za dvacet minut na dně jsou heliem zatížené i kompartmenty, které by dusík sotva ovlivnil.
  Dokud dýcháš směs s heliem, odchází helium z tkání pomalu.
  Jakmile přepneš na plyn bez helia, odchází velmi rychle.
  Proto je na trimixu dekompresní plyn nutností, ne jen výhodou. A jeho ztráta je mnohem vážnější.
  První zastávky bývají hlouběji než u vzduchového ponoru.
  Model dává s heliem delší dekompresi. Novější pokusy to zpochybňují, ale ty se drž svého počítače.
