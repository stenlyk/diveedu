checkQuestionIds: ["skok-co-je", "skok-diagram-mezera", "rozcesti-diagram", "skok-poradi", "mezera-proc", "rozcesti-sipky-past"]
estimatedMinutes: 11
audioSummary: >-
  Každý přechod mezi šňůrami a každé rozcestí je rozhodnutí, které budeš při návratu dělat znovu, možná poslepu.
  Mezera je úsek bez šňůry. Skok je její přemostění vlastní cívkou.
  Nejdřív si označ cestu ven, pak připoj cívku k hlavní šňůře, odviň ji k boční a zajisti.
  Skok zůstává na místě, dokud je tým za ním.
  Na rozcestí dávej osobní značku na šňůru k vlastnímu východu vždy.
  Trvalé šipky nestačí. Ukazují k nejbližšímu východu a ten nemusí být tvůj.
  Souvislá šňůra do otevřené vody nemá výjimky.
