checkQuestionIds: ["co2-co-ridi-dech", "co2-setreni-dechem", "co2-dusledky", "co2-spotreba-namaha", "co2-hypoxie-varovani", "co2-priznaky"]
estimatedMinutes: 12
audioSummary: >-
  Dýchání řídí hlavně oxid uhličitý, ne kyslík. Tělo hlídá jeho hladinu a podle ní zrychluje dech.
  Pod vodou se oxid uhličitý hromadí snadněji než na souši. Plyn je hustý, automatika klade odpor a potápěči často zbytečně šetří dechem.
  Příznaky jsou dušnost, zrychlený dech, bolest hlavy a úzkost.
  Zvýšený oxid uhličitý zesiluje narkózu, snižuje odolnost vůči kyslíkovým křečím a může vyvolat paniku.
  Když cítíš dušnost, zastav se, přestaň pracovat a dlouze vydechuj.
  Nedostatek kyslíku naopak nevaruje. Přichází zmatenost a bezvědomí bez pocitu dušení.
