title: "Hustota dýchaného plynu"
order: 3
conceptIds: ["hustota-plynu", "prace-dychani", "retence-co2"]
checkQuestionIds: ["hustota-vzduch-hloubka", "hustota-proc-vadi", "hustota-limity", "hustota-usili-nepomuze"]
estimatedMinutes: 9
audioSummary: >-
  Hustota dýchaného plynu roste s hloubkou stejně jako tlak. Ve čtyřiceti metrech je vzduch pětkrát hustší než na hladině.
  Hustý plyn klade v dýchacích cestách větší odpor. Dýchání stojí víc práce a od určité hustoty už plícemi víc plynu neprotlačíš, ani když se snažíš.
  Oxid uhličitý se pak hromadí rychleji, než ho stíháš vydýchat.
  Zapamatuj si dvě čísla: doporučený limit pět celých dva gramu na litr a tvrdý limit šest celých dva gramu na litr.
  Vzduch dosáhne prvního limitu zhruba ve třiceti metrech a druhý překročí před čtyřicítkou.
  Proto se hlouběji přidává helium. Ne kvůli automatice, ale kvůli tvým plicím.
