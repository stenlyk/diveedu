estimatedMinutes: 10
audioSummary: >-
  Vztlak je síla, která tě nadnáší. Rovná se tíze vody, kterou vytlačíš.
  Během ponoru se mění. Plyn v lahvích váží, dvojče na dvě stě barech obsahuje přes šest kilogramů vzduchu, a co vydýcháš, o to jsi lehčí.
  Hloubka navíc stlačuje plyn v obleku a v kompenzátoru.
  Vyvažuj se proto na konec ponoru: skoro prázdné lahve, poslední zastávka, prázdný kompenzátor.
  Trim je poloha těla. Vodorovná poloha znamená nejmenší odpor, nižší spotřebu a žádný zvířený sediment.
  Nastavuje se rozložením zátěže, ne pohybem rukou.
sources:
