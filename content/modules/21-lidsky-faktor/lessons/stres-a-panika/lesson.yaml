audioSummary: >-
  Stres je reakce těla na ohrožení. Na souši pomáhá utéct. Pod vodou všechno, co dělá, situaci zhoršuje.
  Vnímání se zúží na jeden problém. Složité úkony se rozpadají. A člověk se vrátí k nejstaršímu návyku, což je plavat nahoru.
  Smyčka paniky vypadá takto. Stres zrychlí dech. Mělký dech špatně odvádí oxid uhličitý. Ten vyvolá úzkost a pocit dušení. A to zvýší stres.
  Přerušíš ji tak, že zastavíš a dlouze vydechneš. Tři takové dechy změní víc než jakákoli úvaha.
  Předejdeš jí nácvikem, postupným zvyšováním nároků a upřímností k sobě před ponorem.
  Stres pod vodou není slabost. Je to fyziologie.
