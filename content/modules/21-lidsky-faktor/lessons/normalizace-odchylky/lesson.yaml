audioSummary: >-
  Normalizace odchylky je proces, ve kterém se porušení pravidla stane normou. Ne rozhodnutím, ale opakováním.
  Jednou pravidlo ohneš, nic se nestane, a mozek si zapíše, že je to bezpečné.
  Ve skutečnosti zjistil jen to, že to jednou vyšlo.
  Příště je ohnutí snazší a o kousek větší.
  Podléhají tomu hlavně zkušení. Každý ponor, při kterém odchylka prošla, je pro ně důkaz.
  Obrana je znát důvod pravidla, ptát se po ponoru, co jsme udělali jinak než podle plánu, a nechat se pozorovat někým zvenčí.
  Že to vyšlo, neznamená, že to bylo bezpečné.
