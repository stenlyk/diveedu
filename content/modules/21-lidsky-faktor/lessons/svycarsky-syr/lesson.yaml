audioSummary: >-
  Mezi nebezpečím a nehodou stojí několik vrstev obrany. Žádná není dokonalá, každá má díry jako plátek sýra.
  Nehoda nastane, když se díry ve všech vrstvách sejdou v jedné přímce.
  Chyba člověka na místě je jen poslední díra.
  Projít k ní bylo možné proto, že předchozí vrstvy byly děravé už dlouho. Lahve bez značení, zvyk analyzovat jen občas, tým, kde se nesluší upozorňovat na chyby.
  Otázka, kdo to zavinil, najde poslední vrstvu. Otázka, které vrstvy selhaly, najde to, co se dá opravit.
  Bezpečnost nestojí na tom, že nikdo neudělá chybu. Stojí na tom, že jedna chyba nestačí.
sources:
