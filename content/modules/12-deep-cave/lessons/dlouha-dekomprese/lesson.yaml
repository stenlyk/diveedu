id: dlouha-dekomprese
moduleId: deepcave
title: "Dlouhá dekomprese: chlad, habitat a podpora"
order: 5
conceptIds: ["habitat", "podpurny-tym", "deko-v-jeskyni", "tepelny-management"]
checkQuestionIds: ["hab-co", "hab-proc", "podpora-ukoly", "deko-chlad", "deko-kyslik"]
estimatedMinutes: 9
audioSummary: >-
  Hluboký jeskynní ponor končí dlouhou dekompresí na místě, kde se nedá vynořit.
  Bez pohybu tělo chladne. Prochladnutí zpomaluje vyplavování plynu právě tehdy, kdy ho potřebuješ nejvíc.
  Dlouhé zastávky na kyslíku zatěžují nervový systém. Řeší se přestávkami na chudší směsi.
  Habitat je suchý prostor pod vodou. Můžeš se v něm napít, najíst a ohřát. Dýcháš ale z automatiky.
  Podpůrný tým rozváží lahve, čeká na dohodnutém místě a přináší plyn.
  Plán musí vyjít i bez něj.
  Dekomprese se plánuje stejně pečlivě jako dno.
