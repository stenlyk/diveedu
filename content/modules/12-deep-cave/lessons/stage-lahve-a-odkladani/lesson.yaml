estimatedMinutes: 11
audioSummary: >-
  Stage lahev prodlužuje průnik a nese dekompresní plyn.
  Cestou dovnitř se dýchá nejdřív ze stage. Zásoba na zádech zůstává nedotčená co nejdéle.
  Ze stage se použije třetina nebo polovina, podle pravidel týmu. Součet plynu po otočce musí stačit na cestu ven pro dva.
  Při odložení přejdi na zásobu na zádech, ověř, že dýcháš, zavři ventil a připni lahev ke šňůře.
  Dekompresní lahve se odkládají tam, kde začnou být potřeba, a dál do hloubky se nenosí.
  Každá odložená lahev má jméno, směs a maximální hloubku.
