audioSummary: >-
  Plán hlubokého jeskynního ponoru se skládá odzadu, od toho, co musí vyjít v nouzi.
  Nejdřív trasa a profil, úsek po úseku. Potom směs na dno podle největší hloubky.
  Dekomprese podle profilu trasy, s variantami pro delší čas.
  Plyn se počítá od cesty ven. Kolik potřebují dva potápěči z nejvzdálenějšího bodu, tolik musí být na zádech.
  Zbytek určuje, zda je potřeba stage.
  Následuje odkládání lahví, navigace, limity a nouzové varianty.
  Plán je tak dobrý jako jeho nejslabší článek. V hluboké jeskyni to bývá plyn na cestu ven pro dva.
  Skutečný plán se dělá s lidmi, kteří jeskyni znají.
