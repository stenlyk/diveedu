estimatedMinutes: 9
audioSummary: >-
  Prostředí se stropem je každé místo, odkud nemůžeš vystoupat přímo na hladinu. Jeskyně, vrak nebo voda pod ledem.
  Cesta ven je jen jedna a je stejně dlouhá jako cesta dovnitř.
  Každý problém se řeší na místě a potom se ještě musí doplavat k východu.
  Na to odpovídá systém jeskynního potápění. Nepřerušená šňůra, tři světla, plyn na cestu ven pro dva a postupy nacvičené poslepu.
  Výcvik postupuje po úrovních. Cavern zůstává v zóně denního světla, intro jde po hlavní šňůře, full cave řeší navigaci.
  Nejnebezpečnější je zkušený potápěč z otevřené vody bez jeskynního výcviku.
