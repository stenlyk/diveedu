audioSummary: >-
  V jeskyni se nevybírá nejrychlejší kop, ale ten, který posílá vodu správným směrem.
  Základem je žabí kop. Nohy pokrčené, ploutve nad tělem, záběr do stran a dozadu a potom skluz.
  V nízkých chodbách se používá jeho menší varianta, v úzkých krátký střídavý kop z kolen.
  Otočení na místě a couvání se dělají ploutvemi, bez rukou.
  Ruce se k pohybu nepoužívají. Jedna drží světlo, druhá je volná pro šňůru.
  Pomalý potápěč s dobrou technikou spotřebuje méně plynu a doplave dál.
  Techniky se učí v otevřené vodě. V jeskyni už mají být hotové.
sources:
