- { cs: absolutní tlak, en: absolute pressure, definition: 'Celkový tlak působící v hloubce – tlak atmosféry plus tlak vodního sloupce.' }
- { cs: hydrostatický tlak, en: hydrostatic (gauge) pressure, definition: 'Tlak samotného vodního sloupce bez atmosféry; ten ukazuje hloubkoměr.' }
- { cs: parciální tlak, en: partial pressure, definition: 'Část celkového tlaku, kterou ve směsi vytváří jeden plyn.' }
- { cs: hustota plynu, en: gas density, definition: 'Hmotnost litru dýchaného plynu v dané hloubce v g/l.' }
- { cs: práce dýchání, en: work of breathing, definition: 'Úsilí potřebné k pohybu plynu dýchacími cestami a automatikou.', pronunciation: práce dýchání }
- { cs: retence CO2, en: CO2 retention (hypercapnia), definition: 'Hromadění oxidu uhličitého v těle.', pronunciation: retence cé ó dva }
- { cs: sycení tkání, en: on-gassing, definition: 'Rozpouštění inertního plynu v tkáních při zvýšeném tlaku.' }
- { cs: dekompresní nemoc, en: decompression sickness (DCS), definition: 'Onemocnění způsobené bublinami inertního plynu po příliš rychlém poklesu tlaku.', pronunciation: dekompresní nemoc }
- { cs: arteriální plynová embolie, en: arterial gas embolism (AGE), definition: 'Vniknutí bublin plynu do tepenného oběhu, typicky po barotraumatu plic.' }
- { cs: vztlak, en: buoyancy, definition: 'Síla nadnášející těleso v kapalině.' }
- { cs: trim, en: trim, definition: 'Poloha těla potápěče ve vodě.' }
- { cs: kyslíková toxicita CNS, en: CNS oxygen toxicity, definition: 'Toxické působení vysokého ppO2 na centrální nervový systém.', pronunciation: kyslíková toxicita cé en es }
- { cs: plicní kyslíková toxicita, en: pulmonary oxygen toxicity, definition: 'Poškození plic dlouhodobou expozicí zvýšenému ppO2.' }
- { cs: maximální operační hloubka, en: maximum operating depth (MOD), definition: 'Největší hloubka, ve které směs nepřekročí zvolený limit ppO2.', pronunciation: em ó dé }
- { cs: ekvivalentní vzduchová hloubka, en: equivalent air depth (EAD), definition: 'Hloubka, ve které by vzduch měl stejné ppN2 jako nitrox ve skutečné hloubce.', pronunciation: é á dé }
- { cs: nitrox, en: enriched air nitrox (EANx), definition: 'Směs kyslíku a dusíku s více než 21 % kyslíku.' }
- { cs: kyslíkové okno, en: oxygen window, definition: 'Rozdíl mezi součtem parciálních tlaků plynů v arteriální a venózní krvi.' }
- { cs: jednotky plicní toxicity, en: oxygen toxicity units (OTU), definition: 'Míra plicní kyslíkové zátěže.', pronunciation: ó té ú }
- { cs: dekompresní lahev, en: decompression (stage) cylinder, definition: 'Samostatná lahev s bohatou směsí pro dekompresi.' }
- { cs: přepnutí plynu, en: gas switch, definition: 'Řízená změna dýchané směsi během ponoru.' }
- { cs: kyslíková čistota, en: oxygen clean / oxygen service, definition: 'Stav vybavení vyčištěného a sestaveného pro styk s vysokým podílem kyslíku.' }
- { cs: adiabatické stlačení, en: adiabatic compression, definition: 'Rychlé stlačení plynu bez odvodu tepla; plyn se prudce ohřeje.' }
- { cs: míchání parciálním tlakem, en: partial pressure blending, definition: 'Příprava směsi postupným plněním složek podle manometru.' }
- { cs: vyrovnání tlaku, en: equalization, definition: 'Doplnění vzduchu do středouší a dutin při sestupu.' }
- { cs: poločas tkáně, en: tissue half-time, definition: 'Doba, za kterou tkáň vyrovná polovinu rozdílu mezi svým a okolním tlakem inertního plynu.' }
- { cs: best mix, en: best mix, definition: 'Nejbohatší směs použitelná v plánované hloubce.' }
- { cs: kompartment, en: tissue compartment, definition: 'Matematický model skupiny tkání se stejným poločasem sycení.' }
- { cs: M-hodnota, en: M-value, definition: 'Nejvyšší tlak inertního plynu, který model v kompartmentu při daném okolním tlaku připouští.', pronunciation: em hodnota }
- { cs: přesycení, en: supersaturation, definition: 'Tlak inertního plynu v tkáni vyšší než okolní tlak.' }
- { cs: gradient factors, en: gradient factors (GF), definition: 'Dvojice čísel určující, jakou část povoleného přesycení smí tkáň čerpat na první zastávce a na hladině.', pronunciation: gradient faktory }
- { cs: dekompresní strop, en: decompression ceiling, definition: 'Nejmenší hloubka, do které lze v danou chvíli vystoupat.' }
- { cs: bezdekompresní limit, en: no-decompression limit (NDL), definition: 'Nejdelší čas v hloubce bez povinných zastávek.', pronunciation: en dé el }
- { cs: tiché bubliny, en: silent bubbles (venous gas emboli), definition: 'Žilní bubliny po ponoru, které nevyvolávají příznaky.' }
- { cs: povrchová spotřeba, en: surface air consumption (SAC) / respiratory minute volume (RMV), definition: 'Spotřeba plynu přepočtená na hladinu v l/min.', pronunciation: sak }
- { cs: minimum gas, en: minimum gas / rock bottom, definition: 'Rezerva pro výstup dvou potápěčů z nejhlubšího bodu.' }
- { cs: run-time, en: run time, definition: 'Čas od opuštění hladiny.', pronunciation: ran tajm }
- { cs: stage lahev, en: stage cylinder, definition: 'Samostatně nesená lahev s vlastní automatikou.', pronunciation: stejdž lahev }
- { cs: manifold, en: isolation manifold, definition: 'Propojení dvou lahví s izolačním ventilem uprostřed.' }
- { cs: ventilový drill, en: valve drill (shutdown drill), definition: 'Nácvik zavírání a otevírání ventilů dvojčete.' }
- { cs: trimix, en: trimix, definition: 'Směs kyslíku, helia a dusíku.' }
- { cs: ekvivalentní narkotická hloubka, en: equivalent narcotic depth (END), definition: 'Hloubka na vzduchu se stejným narkotickým účinkem jako směs ve skutečné hloubce.', pronunciation: é en dé }
- { cs: normoxický trimix, en: normoxic trimix, definition: 'Trimix s nejméně 18 % kyslíku, dýchatelný od hladiny.' }
- { cs: nervový syndrom vysokého tlaku, en: high pressure nervous syndrome (HPNS), definition: 'Neurologické příznaky při rychlém sestupu na heliu do velkých hloubek.', pronunciation: há pé en es }
- { cs: standardní směsi, en: standard gases, definition: 'Pevná sada směsí pro pásma hloubek.' }
- { cs: dusíková narkóza, en: nitrogen narcosis (inert gas narcosis), definition: 'Zhoršení úsudku a koordinace při vysokém parciálním tlaku dusíku.' }
- { cs: reálný plyn, en: real gas (compressibility), definition: 'Plyn, jehož stlačitelnost se odchyluje od ideální rovnice.' }
- { cs: hypoxická směs, en: hypoxic mix, definition: 'Směs s méně než 18 % kyslíku, u hladiny nedýchatelná.' }
- { cs: travel gas, en: travel gas, definition: 'Směs pro úsek mezi hladinou a hloubkou použití dno směsi.', pronunciation: trevl ges }
- { cs: izobarická protidifuze, en: isobaric counterdiffusion (ICD), definition: 'Přesycení vzniklé výměnou inertních plynů bez změny tlaku.', pronunciation: í cé dé }
- { cs: dekompresní nemoc vnitřního ucha, en: inner ear decompression sickness (IEDCS), definition: 'Postižení rovnovážného a sluchového ústrojí bublinami.' }
- { cs: hluboké zastávky, en: deep stops, definition: 'Zastávky hlouběji, než předepisuje model rozpuštěného plynu.' }
- { cs: aktivní ohřev, en: active heating, definition: 'Elektricky vyhřívané prvky pod suchým oblekem.' }
- { cs: podpůrný potápěč, en: support diver, definition: 'Potápěč, který zajišťuje hluboký tým na dekompresi.' }
- { cs: prostředí se stropem, en: overhead environment, definition: 'Místo bez přímé cesty na hladinu.' }
- { cs: vodicí šňůra, en: guideline, definition: 'Nepřerušená šňůra vedoucí k otevřené vodě.' }
- { cs: naviják, en: reel, definition: 'Naviják se šňůrou pro pokládání hlavní šňůry.' }
- { cs: zvíření sedimentu, en: silt-out, definition: 'Ztráta viditelnosti zvířeným sedimentem.' }
- { cs: žabí kop, en: frog kick, definition: 'Kop tlačící vodu dozadu, bez víření dna.' }
- { cs: kontaktní komunikace, en: touch contact, definition: 'Dorozumívání dotykem při nulové viditelnosti.' }
- { cs: tlak otočky, en: turn pressure, definition: 'Tlak, při kterém se ponor obrací.' }
- { cs: past na šňůře, en: line trap, definition: 'Místo, kde šňůra vede prostorem užším než potápěč.' }
- { cs: zóna denního světla, en: daylight (cavern) zone, definition: 'Část jeskyně s viditelným světlem vchodu.' }
- { cs: směrová šipka, en: line arrow, definition: 'Trvalá značka ukazující k nejbližšímu východu.' }
- { cs: osobní značka, en: cookie / REM, definition: 'Nesměrová značka potápěče na šňůře k jeho východu.' }
- { cs: skok, en: jump, definition: 'Přemostění mezery mezi šňůrami vlastní cívkou.' }
- { cs: mezera, en: gap, definition: 'Úsek bez šňůry mezi dvěma šňůrami.' }
- { cs: okruh, en: circuit, definition: 'Trasa, která se vrací jinou cestou ke stejnému vchodu.' }
- { cs: traverz, en: traverse, definition: 'Trasa od jednoho vchodu k jinému.' }
- { cs: zúženina, en: restriction, definition: 'Místo, kudy dva potápěči neproplavou vedle sebe.' }
- { cs: skútr, en: DPV (diver propulsion vehicle), definition: 'Podvodní tahač.' }
- { cs: sidemount, en: sidemount, definition: 'Konfigurace s lahvemi po stranách těla.' }
- { cs: použitelný podíl plynu, en: usable gas fraction, definition: 'Část zásoby použitelná na cestu dovnitř; nejvýš třetina.' }
- { cs: pilovitý profil, en: sawtooth profile, definition: 'Profil s opakovanými sestupy a výstupy.' }
- { cs: odložení stage, en: stage drop, definition: 'Zanechání lahve na šňůře pro cestu ven.' }
- { cs: habitat, en: decompression habitat, definition: 'Suchý prostor pod vodou pro dlouhou dekompresi.' }
- { cs: podpůrný tým, en: support team, definition: 'Potápěči a lidé na hladině, kteří zajišťují plyn, logistiku a pomoc hlavnímu týmu.' }
- { cs: samovolný průtok, en: free-flow, definition: 'Automatika nepřestává dodávat plyn.' }
- { cs: plynová embolie, en: arterial gas embolism (AGE), definition: 'Bubliny plynu v tepnách po poranění plic přetlakem.' }
- { cs: nekontrolovaný výstup, en: uncontrolled ascent, definition: 'Výstup rychlejší, než potápěč chce.' }
- { cs: 'zastav, dýchej, mysli', en: 'stop, breathe, think', definition: 'První krok každé nouze pod vodou.' }
- { cs: vynechaná dekomprese, en: omitted decompression, definition: 'Výstup nad strop nebo vynoření bez dokončení zastávek.' }
- { cs: barotrauma plic, en: pulmonary barotrauma, definition: 'Poranění plic rozpínajícím se plynem.' }
- { cs: evakuační plán, en: emergency action plan, definition: 'Předem připravená cesta k odborné pomoci.' }
- { cs: kyslík jako první pomoc, en: emergency oxygen, definition: 'Dýchání co nejvyšší koncentrace kyslíku na hladině.' }
- { cs: model švýcarského sýra, en: Swiss cheese model, definition: 'Nehoda jako průchod dírami v několika vrstvách obrany.' }
- { cs: normalizace odchylky, en: normalization of deviance, definition: 'Odchylka bez následků se stává novým standardem.' }
- { cs: úkolová zahlcenost, en: task loading, definition: 'Víc úkolů, než kolik pozornost unese.' }
- { cs: situační přehled, en: situational awareness, definition: 'Vnímat, rozumět a předvídat.' }
- { cs: uzavřená smyčka, en: closed-loop communication, definition: 'Sdělení, zopakování a potvrzení.' }
- { cs: rozbor po ponoru, en: debrief, definition: 'Společné zhodnocení ponoru bez hledání viníka.' }
- { cs: panika, en: panic, definition: 'Ztráta kontroly nad jednáním pod vlivem stresu.' }
- { cs: checklist, en: checklist, definition: 'Krátký seznam kritických kroků.' }
- { cs: tlak na dokončení, en: goal fixation / plan continuation bias, definition: 'Sklon pokračovat v plánu, i když důvody ke zrušení přibývají.' }
- { cs: dlouhá hadice, en: long hose, definition: 'Hadice hlavní automatiky dlouhá asi dva metry; při nouzi se podává partnerovi.' }
- { cs: první stupeň, en: first stage, definition: 'Část regulátoru na ventilu lahve, která snižuje tlak z lahve na střední tlak.' }
- { cs: střední tlak, en: intermediate pressure, definition: 'Tlak v hadicích mezi prvním stupněm a automatikou; zhruba deset barů nad okolním tlakem.' }
- { cs: DIN ventil, en: DIN valve, definition: 'Ventil se závitem, do kterého se první stupeň zašroubuje; těsnicí kroužek je uzavřený uvnitř.', pronunciation: dín ventil }
- { cs: dekompresní počítač, en: dive computer, definition: 'Přístroj, který z hloubky a času počítá dekompresní model.' }
- { cs: záložní počítač, en: backup computer, definition: 'Druhý nezávislý zdroj hloubky a času pro případ, že hlavní počítač selže.' }
- { cs: suchý oblek, en: drysuit, definition: 'Nepromokavý oblek; izoluje vrstva plynu v podobleku.' }
- { cs: argonová lahev, en: argon bottle, definition: 'Malá lahev s argonem pro plnění suchého obleku; neobsahuje kyslík a nesmí se z ní dýchat.' }
- { cs: vyvážení, en: weighting, definition: 'Množství zátěže, se kterým potápěč na konci ponoru udrží poslední zastávku.' }
- { cs: křídlo, en: wing, definition: 'Vztlakový vak na zádech technického potápěče.' }
- { cs: dehydratace, en: dehydration, definition: 'Nedostatek tekutin v těle; zhoršuje prokrvení a zvyšuje riziko DCS.' }
- { cs: foramen ovale, en: foramen ovale, definition: 'Otvor mezi pravou a levou síní srdce, kterým před narozením obtéká krev plíce.', pronunciation: foramen ovále }
- { cs: otevřené foramen ovale, en: patent foramen ovale (PFO), definition: 'Foramen ovale, které po narození úplně nesrostlo a může se pootevřít.', pronunciation: otevřené foramen ovále }
- { cs: konzervativní profil, en: conservative diving, definition: 'Ponor plánovaný tak, aby vzniklo co nejméně bublin.' }
- { cs: imerzní edém plic, en: immersion pulmonary edema (IPE), definition: 'Prosakování tekutiny do plicních sklípků během ponoření.' }
- { cs: barotrauma, en: barotrauma, definition: 'Poranění rozdílem tlaků mezi plynem v dutině těla a okolím.' }
- { cs: barotrauma dutin, en: sinus and squeeze barotrauma, definition: 'Barotrauma vedlejších nosních dutin, obličeje pod maskou, kůže pod oblekem nebo zubu.' }
- { cs: lékařská způsobilost, en: fitness to dive, definition: 'Zdravotní stav, který dovoluje potápět se s přijatelným rizikem.' }
- { cs: rekomprese, en: recompression, definition: 'Léčba v přetlakové komoře s dýcháním kyslíku.' }
- { cs: pneumotorax, en: pneumothorax, definition: 'Vzduch mezi plící a hrudní stěnou; plíce se částečně nebo úplně zhroutí.' }
