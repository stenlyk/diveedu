# ── Modul 0: Základy fyziky a fyziologie ─────────────────────────────────────
- { id: hloubka, label: Hloubka, type: quantity, moduleId: zaklady, shortDefinition: Svislá vzdálenost pod hladinou v metrech; vstup téměř každého výpočtu. }
- { id: absolutni-tlak, label: Absolutní tlak, type: quantity, moduleId: zaklady, shortDefinition: Součet tlaku atmosféry a tlaku vodního sloupce v barech. }
- { id: vzorec-p-abs, label: Vzorec absolutního tlaku, type: formula, moduleId: zaklady, formulaId: p-abs, shortDefinition: Hloubka dělená deseti plus jedna. }
- { id: objem-plynu, label: Objem plynu, type: quantity, moduleId: zaklady, shortDefinition: 'Prostor, který zabírá dané množství plynu; s rostoucím tlakem se zmenšuje.' }
- { id: vzorec-boyle, label: Boyleův zákon, type: formula, moduleId: zaklady, formulaId: boyle, shortDefinition: Při stálé teplotě je součin tlaku a objemu plynu stálý. }
- { id: barotrauma-plic, label: Barotrauma plic, type: risk, moduleId: zaklady, shortDefinition: 'Poškození plic rozpínajícím se plynem při výstupu se zadrženým dechem; může vést k arteriální plynové embolii.' }
- { id: hustota-plynu, label: Hustota plynu, type: quantity, moduleId: zaklady, shortDefinition: 'Hmotnost litru dýchaného plynu v dané hloubce; roste přímo úměrně tlaku.' }
- { id: prace-dychani, label: Práce dýchání, type: physiology, moduleId: zaklady, shortDefinition: 'Úsilí potřebné k protlačení plynu dýchacími cestami a automatikou; roste s hustotou plynu.' }
- { id: parcialni-tlak, label: Parciální tlak, type: quantity, moduleId: zaklady, shortDefinition: 'Část celkového tlaku, kterou ve směsi vytváří jeden plyn.' }
- { id: ppo2, label: ppO2, type: quantity, moduleId: zaklady, shortDefinition: Parciální tlak kyslíku; rozhoduje o hypoxii i o kyslíkové toxicitě. }
- { id: ppn2, label: ppN2, type: quantity, moduleId: zaklady, shortDefinition: Parciální tlak dusíku; řídí sycení tkání a narkózu. }
- { id: vzorec-dalton, label: Daltonův zákon, type: formula, moduleId: zaklady, formulaId: dalton, shortDefinition: Parciální tlak plynu je jeho podíl ve směsi krát celkový tlak. }
- { id: vzduch, label: Vzduch, type: gas, moduleId: zaklady, shortDefinition: 'Směs přibližně 21 % kyslíku a 79 % dusíku (včetně asi 1 % argonu a dalších plynů).' }
- { id: kyslik, label: Kyslík, type: gas, moduleId: zaklady, shortDefinition: 'Plyn nutný pro život; při vysokém parciálním tlaku toxický a v koncentraci silně podporuje hoření.' }
- { id: dusik, label: Dusík, type: gas, moduleId: zaklady, shortDefinition: 'Inertní plyn vzduchu; tělo ho nespotřebovává, jen rozpouští – zdroj dekompresní zátěže a narkózy.' }
- { id: dusikova-narkoza, label: Dusíková narkóza, type: physiology, moduleId: zaklady, shortDefinition: 'Zhoršení úsudku, paměti a koordinace při vysokém parciálním tlaku dusíku.' }
- { id: rozpustnost-plynu, label: Rozpustnost plynu, type: quantity, moduleId: zaklady, shortDefinition: 'Množství plynu, které kapalina pojme; je úměrné parciálnímu tlaku plynu nad ní.' }
- { id: syceni-tkani, label: Sycení tkání, type: physiology, moduleId: zaklady, shortDefinition: 'Postupné rozpouštění inertního plynu v tkáních, dokud se tlak v tkáni nevyrovná s okolím.' }
- { id: dcs, label: Dekompresní nemoc (DCS), type: risk, moduleId: zaklady, shortDefinition: 'Onemocnění způsobené bublinami inertního plynu, které se uvolní v tkáních a krvi při příliš rychlém poklesu tlaku.' }
- { id: teplota, label: Teplota, type: quantity, moduleId: zaklady, shortDefinition: Teplota plynu nebo vody; mění tlak v lahvi i tepelné ztráty potápěče. }
- { id: tlak-v-lahvi, label: Tlak v lahvi, type: quantity, moduleId: zaklady, shortDefinition: 'Údaj manometru; spolu s objemem lahve určuje zásobu plynu.' }
- { id: vztlak, label: Vztlak, type: quantity, moduleId: zaklady, shortDefinition: Síla nadnášející těleso; rovná se tíze vytlačené vody. }
- { id: trim, label: Trim, type: procedure, moduleId: zaklady, shortDefinition: 'Poloha těla ve vodě; vodorovný trim snižuje odpor, spotřebu i víření sedimentu.' }
- { id: ztrata-tepla, label: Ztráta tepla, type: physiology, moduleId: zaklady, shortDefinition: 'Odvod tepla z těla do vody a do dýchaného plynu; vede k podchlazení.' }
- { id: retence-co2, label: Retence CO2, type: physiology, moduleId: zaklady, shortDefinition: 'Hromadění oxidu uhličitého v těle, když ho dýchání nestíhá odvádět.' }
- { id: namaha, label: Námaha, type: physiology, moduleId: zaklady, shortDefinition: Fyzická zátěž; zvyšuje spotřebu kyslíku a tvorbu CO2. }
- { id: hypoxie, label: Hypoxie, type: risk, moduleId: zaklady, shortDefinition: 'Nedostatek kyslíku v tkáních; pod ppO2 přibližně 0,16 bar se zhoršuje výkon a úsudek, hlouběji pod touto hranicí hrozí bezvědomí bez varování.' }
- { id: transport-kysliku, label: Transport kyslíku, type: physiology, moduleId: zaklady, shortDefinition: 'Přenos kyslíku krví, převážně vázaného na hemoglobin, z plic do tkání.' }
- { id: barotrauma-ucha, label: Barotrauma ucha, type: risk, moduleId: zaklady, shortDefinition: 'Poškození středního nebo vnitřního ucha rozdílem tlaků při nevyrovnání.' }
- { id: vyrovnani-tlaku, label: Vyrovnání tlaku, type: procedure, moduleId: zaklady, shortDefinition: 'Doplnění vzduchu do středouší a dutin Eustachovou trubicí při sestupu.' }

# ── Modul 1: Advanced Nitrox ─────────────────────────────────────────────────
- { id: nitrox, label: Nitrox, type: gas, moduleId: nitrox, shortDefinition: 'Směs kyslíku a dusíku s více než 21 % kyslíku (EANx).' }
- { id: frakce-kysliku, label: Frakce kyslíku (fO2), type: quantity, moduleId: nitrox, shortDefinition: 'Podíl kyslíku ve směsi jako desetinné číslo; EAN32 má fO2 0,32.' }
- { id: vzorec-mod, label: Vzorec MOD, type: formula, moduleId: nitrox, formulaId: mod, shortDefinition: 'Maximální operační hloubka: hloubka, kde směs dosáhne limitu ppO2.' }
- { id: prekroceni-mod, label: Překročení MOD, type: risk, moduleId: nitrox, shortDefinition: Sestup pod maximální operační hloubku směsi; ppO2 překročí zvolený limit. }
- { id: cns-toxicita, label: Kyslíková toxicita CNS, type: risk, moduleId: nitrox, shortDefinition: 'Působení vysokého ppO2 na mozek; může skončit křečemi a utonutím bez varování.' }
- { id: vzorec-cns, label: CNS hodiny, type: formula, moduleId: nitrox, formulaId: cns, shortDefinition: Podíl vyčerpaného časového limitu NOAA pro dané ppO2. }
- { id: plicni-toxicita, label: Plicní kyslíková toxicita, type: physiology, moduleId: nitrox, shortDefinition: 'Podráždění a poškození plic dlouhodobým dýcháním ppO2 nad 0,5 bar.' }
- { id: vzorec-otu, label: Vzorec OTU, type: formula, moduleId: nitrox, formulaId: otu, shortDefinition: Jednotky plicní kyslíkové zátěže z ppO2 a času. }
- { id: vzorec-ead, label: Vzorec EAD, type: formula, moduleId: nitrox, formulaId: ead, shortDefinition: 'Ekvivalentní vzduchová hloubka: hloubka na vzduchu se stejným ppN2.' }
- { id: vzorec-best-mix, label: Best mix, type: formula, moduleId: nitrox, formulaId: best-mix, shortDefinition: Nejbohatší směs pro plánovanou hloubku a limit ppO2. }
- { id: kyslikove-okno, label: Kyslíkové okno, type: physiology, moduleId: nitrox, shortDefinition: 'Rozdíl mezi součtem tlaků plynů v arteriální a venózní krvi, vzniklý spotřebou kyslíku v tkáních.' }
- { id: analyza-plynu, label: Analýza plynu, type: procedure, moduleId: nitrox, shortDefinition: Osobní změření podílu kyslíku v každé lahvi před ponorem. }
- { id: analyzator-kysliku, label: Analyzátor kyslíku, type: equipment, moduleId: nitrox, shortDefinition: 'Přístroj s galvanickým článkem, který měří podíl kyslíku; před měřením se kalibruje.' }
- { id: znaceni-lahvi, label: Značení lahví, type: procedure, moduleId: nitrox, shortDefinition: 'Štítek s naměřeným složením, MOD, datem a podpisem; MOD čitelně i pro partnera.' }
- { id: zamena-plynu, label: Záměna plynu, type: risk, moduleId: nitrox, shortDefinition: 'Dýchání jiné směsi, než si potápěč myslí – nejčastěji bohaté směsi příliš hluboko.' }
- { id: ean50, label: EAN50, type: gas, moduleId: nitrox, shortDefinition: Nitrox s 50 % kyslíku; běžný dekompresní plyn od 21 m. }
- { id: prepnuti-plynu, label: Přepnutí plynu, type: procedure, moduleId: nitrox, shortDefinition: 'Řízený postup změny dýchané směsi s kontrolou hloubky, lahve a potvrzením partnera.' }
- { id: deko-lahev, label: Dekompresní lahev, type: equipment, moduleId: nitrox, shortDefinition: Samostatná lahev (stage) s bohatou směsí pro dekompresi. }
- { id: kyslikova-cistota, label: Kyslíková čistota, type: procedure, moduleId: nitrox, shortDefinition: 'Vyčištění a použití kompatibilních materiálů u vybavení, které přijde do styku s vysokým podílem kyslíku.' }
- { id: kyslikovy-pozar, label: Kyslíkový požár, type: risk, moduleId: nitrox, shortDefinition: 'Vznícení maziva, těsnění nebo nečistot v prostředí bohatém na kyslík.' }
- { id: michani-parcialnim-tlakem, label: Míchání parciálním tlakem, type: procedure, moduleId: nitrox, shortDefinition: 'Příprava směsi postupným plněním složek podle tlaku: nejdřív kyslík, pak vzduch.' }

# ── Modul 2: Decompression Procedures ────────────────────────────────────────
- { id: kompartment, label: Tkáňový kompartment, type: physiology, moduleId: deko, shortDefinition: 'Matematický model skupiny tkání se stejnou rychlostí sycení; není to konkrétní orgán.' }
- { id: polocas-tkane, label: Poločas tkáně, type: quantity, moduleId: deko, shortDefinition: 'Doba, za kterou kompartment vyrovná polovinu rozdílu mezi svým a vdechovaným tlakem inertního plynu.' }
- { id: model-buhlmann, label: Bühlmann ZHL-16C, type: formula, moduleId: deko, shortDefinition: 'Dekompresní model se 16 kompartmenty a M-hodnotami; základ většiny potápěčských počítačů.' }
- { id: presyceni, label: Přesycení, type: physiology, moduleId: deko, shortDefinition: 'Stav, kdy je tlak inertního plynu v tkáni vyšší než okolní tlak; hnací síla vysycování i vzniku bublin.' }
- { id: m-hodnota, label: M-hodnota, type: quantity, moduleId: deko, formulaId: m-hodnota, shortDefinition: 'Nejvyšší tlak inertního plynu, který model v kompartmentu při daném okolním tlaku připouští.' }
- { id: gradient-factor, label: Gradient factors, type: quantity, moduleId: deko, formulaId: gradient-factor, shortDefinition: 'Nastavení konzervativnosti: jakou část rozdílu mezi okolním tlakem a M-hodnotou smí tkáň čerpat (GF low / GF high).' }
- { id: gf99, label: GF99 a surfacing GF, type: quantity, moduleId: deko, shortDefinition: 'Okamžitý gradient factor vedoucí tkáně a gradient factor, který by vznikl okamžitým výstupem na hladinu.' }
- { id: bubliny, label: Tiché bubliny, type: physiology, moduleId: deko, shortDefinition: 'Bubliny v žilní krvi, které vznikají po většině ponorů bez příznaků; plíce je odfiltrují.' }
- { id: bublinove-modely, label: 'Bublinové modely (VPM, RGBM)', type: formula, moduleId: deko, shortDefinition: 'Modely, které místo limitu přesycení hlídají růst bublin; předepisují hlubší první zastávky.' }
- { id: strop-dekomprese, label: Dekompresní strop, type: quantity, moduleId: deko, shortDefinition: 'Nejmenší hloubka, do které lze v danou chvíli vystoupat bez překročení limitu modelu.' }
- { id: deko-zastavka, label: Dekompresní zastávka, type: procedure, moduleId: deko, shortDefinition: 'Povinné zdržení v dané hloubce, dokud strop neklesne pod další zastávku.' }
- { id: bezdekompresni-limit, label: Bezdekompresní limit, type: quantity, moduleId: deko, shortDefinition: 'Nejdelší čas v hloubce, po kterém lze podle modelu vystoupat přímo na hladinu.' }
- { id: rychlost-vystupu, label: Rychlost výstupu, type: procedure, moduleId: deko, shortDefinition: 'Řízený výstup kolem 9–10 m/min; je součástí dekomprese, ne cestou k ní.' }
- { id: sac, label: Povrchová spotřeba (SAC), type: quantity, moduleId: deko, formulaId: sac, shortDefinition: 'Objem plynu, který potápěč prodýchá za minutu, přepočtený na hladinu (l/min).' }
- { id: minimum-gas, label: Minimum gas (rock bottom), type: quantity, moduleId: deko, formulaId: minimum-gas, shortDefinition: 'Rezerva, která dostane dva potápěče z nejhlubšího bodu na hladinu nebo k dalšímu plynu.' }
- { id: pravidlo-tretin, label: Pravidlo třetin, type: procedure, moduleId: deko, shortDefinition: 'Třetina plynu na cestu tam, třetina zpět, třetina rezerva; pro ponory bez přímé cesty na hladinu.' }
- { id: planovani-plynu, label: Plánování plynu, type: procedure, moduleId: deko, shortDefinition: 'Výpočet potřeby a rezerv každého plynu pro plánovaný ponor i pro jeho poruchy.' }
- { id: run-time, label: Run-time, type: quantity, moduleId: deko, shortDefinition: 'Čas od opuštění hladiny; rozvrh ponoru udává, v kolikáté minutě opouštíš kterou hloubku.' }
- { id: stage-lahev, label: Stage lahev, type: equipment, moduleId: deko, shortDefinition: 'Samostatně nesená lahev s vlastní automatikou, připnutá na boku.' }
- { id: twinset, label: Dvojče s manifoldem, type: equipment, moduleId: deko, shortDefinition: 'Dvě propojené lahve se dvěma prvními stupni a izolačním ventilem; redundance bez ztráty plynu.' }
- { id: ventilovy-drill, label: Ventilový drill, type: procedure, moduleId: deko, shortDefinition: 'Nacvičené zavření a otevření ventilů dvojčete, kterým se izoluje únik plynu.' }
- { id: unik-plynu, label: Únik plynu, type: risk, moduleId: deko, shortDefinition: 'Porucha automatiky, hadice nebo ventilu, při které plyn nekontrolovaně uniká.' }
- { id: ztrata-deko-plynu, label: Ztráta dekompresního plynu, type: risk, moduleId: deko, shortDefinition: 'Situace, kdy dekompresní směs není k dispozici a dekomprese se musí dokončit na jiném plynu.' }
- { id: vynechana-dekomprese, label: Vynechaná dekomprese, type: risk, moduleId: deko, shortDefinition: 'Výstup nad strop nebo vynoření bez dokončení povinných zastávek.' }
- { id: tym, label: Týmový postup, type: procedure, moduleId: deko, shortDefinition: 'Společný plán, role a vzájemná kontrola; tým je záložní mozek i záložní plyn.' }
- { id: plan-ponoru, label: Plán ponoru, type: procedure, moduleId: deko, shortDefinition: 'Písemně stanovené limity, plyny, rozvrh a záložní varianty, které se pod vodou jen plní.' }

# ── Modul 3: Normoxic Trimix ─────────────────────────────────────────────────
- { id: helium, label: Helium, type: gas, moduleId: trimix, shortDefinition: 'Lehký inertní plyn bez narkotického účinku v potápěčských hloubkách; snižuje narkózu i hustotu směsi.' }
- { id: trimix, label: Trimix, type: gas, moduleId: trimix, shortDefinition: 'Směs kyslíku, helia a dusíku; značí se Tx kyslík/helium, například Tx 18/45.' }
- { id: frakce-helia, label: Frakce helia (fHe), type: quantity, moduleId: trimix, shortDefinition: 'Podíl helia ve směsi; určuje narkotickou hloubku i hustotu.' }
- { id: normoxicka-smes, label: Normoxická směs, type: gas, moduleId: trimix, shortDefinition: 'Trimix s nejméně 18 % kyslíku, dýchatelný od hladiny.' }
- { id: vzorec-end, label: Vzorec END, type: formula, moduleId: trimix, formulaId: end, shortDefinition: 'Ekvivalentní narkotická hloubka: hloubka na vzduchu se stejným narkotickým účinkem.' }
- { id: narkoticnost-kysliku, label: Narkotičnost kyslíku, type: physiology, moduleId: trimix, shortDefinition: 'Nerozhodnutá otázka, zda kyslík přispívá k narkóze; od odpovědi závisí výpočet END.' }
- { id: hluboky-vzduch, label: Hluboké potápění na vzduch, type: risk, moduleId: trimix, shortDefinition: 'Ponory na vzduch pod zhruba 40 m, kde se sčítá narkóza, hustota plynu, CO2 a vysoké ppO2.' }
- { id: vzorec-hustota, label: Vzorec hustoty směsi, type: formula, moduleId: trimix, formulaId: hustota, shortDefinition: 'Hustota směsi z frakcí kyslíku, dusíku a helia a absolutního tlaku.' }
- { id: limit-hustoty, label: Limit hustoty plynu, type: quantity, moduleId: trimix, shortDefinition: 'Doporučených 5,2 g/l a tvrdý limit 6,2 g/l pro hustotu dýchaného plynu.' }
- { id: tepelne-vlastnosti-helia, label: Tepelné vlastnosti helia, type: quantity, moduleId: trimix, shortDefinition: 'Helium vede teplo asi šestkrát lépe než vzduch; proto se nepoužívá k plnění suchého obleku.' }
- { id: argon, label: Argon, type: gas, moduleId: trimix, shortDefinition: 'Těžký inertní plyn s nízkou tepelnou vodivostí, používaný k plnění suchého obleku.' }
- { id: hpns, label: 'Nervový syndrom vysokého tlaku (HPNS)', type: physiology, moduleId: trimix, shortDefinition: 'Třes, závratě a poruchy soustředění při rychlém sestupu na heliu pod zhruba 150 m.' }
- { id: difuze-helia, label: Rychlá difuze helia, type: physiology, moduleId: trimix, shortDefinition: 'Helium se v tkáních sytí i vysycuje asi 2,65krát rychleji než dusík.' }
- { id: deko-s-heliem, label: Dekomprese s heliem, type: procedure, moduleId: trimix, shortDefinition: 'Helium mění tvar dekomprese: rychlé tkáně jsou zatížené dřív a dekompresní plyn je téměř nutností.' }
- { id: optimalni-trimix, label: Optimální trimix, type: formula, moduleId: trimix, formulaId: optimalni-trimix, shortDefinition: 'Nejvíc kyslíku a nejméně helia, které pro danou hloubku splní limity ppO2, END a hustoty.' }
- { id: standardni-smesi, label: Standardní směsi, type: procedure, moduleId: trimix, shortDefinition: 'Malá pevná sada směsí pro pásma hloubek místo směsi počítané pro každý ponor.' }
- { id: michani-trimixu, label: Míchání trimixu, type: procedure, moduleId: trimix, formulaId: michani-trimixu, shortDefinition: 'Příprava trimixu parciálním tlakem: helium, kyslík a doplnění vzduchem.' }
- { id: analyza-helia, label: Analýza helia, type: procedure, moduleId: trimix, shortDefinition: 'Změření podílu helia vlastním analyzátorem; bez něj END ani dekompresi neznáš.' }
- { id: realny-plyn, label: Chování reálného plynu, type: quantity, moduleId: trimix, shortDefinition: 'Odchylka skutečné stlačitelnosti plynu od ideální rovnice; u helia při vysokých tlacích znatelná.' }
- { id: plan-vice-plynu, label: Plán s více plyny, type: procedure, moduleId: trimix, shortDefinition: 'Plán ponoru s dno směsí a jedním či dvěma dekompresními plyny včetně rezerv a záložních rozvrhů.' }

# ── Modul 4: Full Trimix ─────────────────────────────────────────────────────
- { id: hypoxicka-smes, label: Hypoxická směs, type: gas, moduleId: fulltrimix, shortDefinition: 'Trimix s méně než 18 % kyslíku; u hladiny nedýchatelný, určený pro velké hloubky.' }
- { id: minimalni-hloubka, label: Minimální hloubka směsi, type: formula, moduleId: fulltrimix, formulaId: min-hloubka, shortDefinition: 'Hloubka, od které má hypoxická směs dostatečné ppO2.' }
- { id: travel-gas, label: Travel gas, type: gas, moduleId: fulltrimix, shortDefinition: 'Směs dýchaná mezi hladinou a hloubkou, kde lze přejít na hypoxickou dno směs.' }
- { id: prepnuti-pri-sestupu, label: Přepnutí při sestupu, type: procedure, moduleId: fulltrimix, shortDefinition: 'Řízený přechod z travel plynu na dno směs v plánované hloubce při sestupu.' }
- { id: icd, label: 'Izobarická protidifuze (ICD)', type: physiology, moduleId: fulltrimix, shortDefinition: 'Přesycení vzniklé bez změny hloubky: jeden inertní plyn vstupuje do tkáně rychleji, než druhý odchází.' }
- { id: pravidlo-petin, label: Pravidlo pětin, type: formula, moduleId: fulltrimix, formulaId: pravidlo-petin, shortDefinition: 'Provozní konvence: při přepnutí nemá podíl dusíku vzrůst o víc než pětinu poklesu podílu helia.' }
- { id: dcs-vnitrniho-ucha, label: Dekompresní nemoc vnitřního ucha, type: risk, moduleId: fulltrimix, shortDefinition: 'Prudká závrať, zvracení a porucha sluchu během dekomprese hlubokých ponorů na heliu.' }
- { id: hluboke-zastavky, label: Hluboké zastávky, type: procedure, moduleId: fulltrimix, shortDefinition: 'Zastávky hlouběji, než předepisuje model rozpuštěného plynu; předmět dlouhé debaty.' }
- { id: plan-ctyr-plynu, label: Plán se třemi až čtyřmi plyny, type: procedure, moduleId: fulltrimix, shortDefinition: 'Dno směs, travel gas a jeden až dva dekompresní plyny s vlastními rezervami a záložními rozvrhy.' }
- { id: kyslik-vice-dni, label: Kyslíková zátěž přes více dní, type: quantity, moduleId: fulltrimix, formulaId: repex, shortDefinition: 'Součet plicní kyslíkové zátěže (OTU) za sérii dní; limit na den klesá s délkou série.' }
- { id: vzduchove-prestavky, label: Kyslíkové přestávky, type: procedure, moduleId: fulltrimix, shortDefinition: 'Krátké úseky na plynu s nižším ppO2 během dlouhé dekomprese na kyslíku.' }
- { id: tepelny-management, label: Tepelný management, type: procedure, moduleId: fulltrimix, shortDefinition: 'Řízení tepla během ponoru: chladněji na dně, teplo na dekompresi.' }
- { id: aktivni-ohrev, label: Aktivní ohřev, type: equipment, moduleId: fulltrimix, shortDefinition: 'Elektricky vyhřívaná vesta nebo podoblek; pomáhá i škodí podle toho, kdy je zapnutý.' }
- { id: dehydratace, label: Dehydratace, type: physiology, moduleId: fulltrimix, shortDefinition: 'Úbytek tekutin ponořením, suchým plynem a pocením; zhoršuje prokrvení a zvyšuje riziko DCS.' }
- { id: podpurny-tym, label: Podpůrný tým, type: procedure, moduleId: fulltrimix, shortDefinition: 'Potápěči a lidé na hladině, kteří zajišťují plyn, komunikaci a pomoc hlubokému týmu.' }
- { id: odlozeny-plyn, label: Odložený plyn, type: procedure, moduleId: fulltrimix, shortDefinition: 'Lahve předem rozmístěné na trase výstupu nebo na dekompresní stanici.' }
- { id: evakuacni-plan, label: Evakuační plán, type: procedure, moduleId: fulltrimix, shortDefinition: 'Předem známá cesta k hyperbarické komoře: kyslík, transport, kontakty a časy.' }
- { id: limit-otevreneho-okruhu, label: Hranice otevřeného okruhu, type: risk, moduleId: fulltrimix, shortDefinition: 'Hloubka, ve které už spotřeba plynu, logistika a čas dekomprese přestávají být na otevřeném okruhu zvládnutelné.' }

# ── Modul C1: Cavern / Intro Cave ────────────────────────────────────────────
- { id: prostredi-se-stropem, label: Prostředí se stropem, type: risk, moduleId: cavern, shortDefinition: 'Místo, odkud nelze vystoupat přímo na hladinu: jeskyně, vrak, led.' }
- { id: zona-denniho-svetla, label: Zóna denního světla, type: quantity, moduleId: cavern, shortDefinition: 'Část jeskyně, ze které je vidět přirozené světlo vchodu; hranice ponorů úrovně cavern.' }
- { id: pet-pravidel, label: Pět pravidel jeskynního potápění, type: procedure, moduleId: cavern, shortDefinition: 'Výcvik, šňůra, třetiny, hloubka, světla – pravidla odvozená z rozboru smrtelných nehod.' }
- { id: vodici-snura, label: Vodicí šňůra, type: equipment, moduleId: cavern, shortDefinition: 'Nepřerušená šňůra od otevřené vody ke každému místu, kam potápěč vplave.' }
- { id: navijak, label: Naviják a cívka, type: equipment, moduleId: cavern, shortDefinition: 'Naviják pro hlavní šňůru od vchodu; malé cívky pro spojky a nouzové hledání.' }
- { id: uvazani-snury, label: Uvázání šňůry, type: procedure, moduleId: cavern, shortDefinition: 'Primární uvázání v otevřené vodě, sekundární uvnitř a další úchyty podle tvaru chodby.' }
- { id: past-na-snure, label: Past na šňůře, type: risk, moduleId: cavern, shortDefinition: 'Místo, kde šňůra vede užším prostorem, než kudy projde potápěč.' }
- { id: tri-svetla, label: Tři světla, type: equipment, moduleId: cavern, shortDefinition: 'Hlavní svítilna a dvě záložní; každá musí sama vystačit na cestu ven.' }
- { id: svetelne-signaly, label: Světelné signály, type: procedure, moduleId: cavern, shortDefinition: 'Kruh = v pořádku, pomalý pohyb = pozor, rychlé mávání = nouze.' }
- { id: kontaktni-komunikace, label: Kontaktní komunikace, type: procedure, moduleId: cavern, shortDefinition: 'Dorozumívání dotykem při nulové viditelnosti: stisk, tlak vpřed, tah vzad.' }
- { id: sediment, label: Zvíření sedimentu, type: risk, moduleId: cavern, shortDefinition: 'Jemný sediment zvednutý ploutví, rukou nebo bublinami; může na hodiny zrušit viditelnost.' }
- { id: nulova-viditelnost, label: Nulová viditelnost, type: risk, moduleId: cavern, shortDefinition: 'Stav, kdy nevidíš světlo ani vlastní ruku; orientace jen hmatem po šňůře.' }
- { id: zabi-kop, label: Žabí kop, type: procedure, moduleId: cavern, shortDefinition: 'Kop, který tlačí vodu dozadu, ne dolů; základ pohybu nad sedimentem.' }
- { id: manevrovaci-kopy, label: Manévrovací kopy, type: procedure, moduleId: cavern, shortDefinition: 'Otočení na místě a couvání bez použití rukou.' }
- { id: tlak-otocky, label: Tlak otočky, type: quantity, moduleId: cavern, formulaId: tretiny, shortDefinition: 'Tlak, při kterém se ponor obrací; vychází z pravidla třetin a určuje ho nejslabší článek týmu.' }
- { id: dosah-pruniku, label: Dosah průniku, type: quantity, moduleId: cavern, formulaId: dosah, shortDefinition: 'Vzdálenost, kterou lze uplavat na plyn určený pro cestu dovnitř.' }
- { id: ztrata-snury, label: Ztráta šňůry, type: risk, moduleId: cavern, shortDefinition: 'Situace, kdy potápěč nemá šňůru na dosah ani na dohled.' }
- { id: selhani-svetla, label: Selhání světla, type: risk, moduleId: cavern, shortDefinition: 'Porucha hlavní svítilny; přechod na záložní a ukončení ponoru.' }
- { id: sdileni-plynu, label: Sdílení plynu při návratu, type: procedure, moduleId: cavern, shortDefinition: 'Výstup dvou potápěčů z jedné zásoby na dlouhé hadici, v zákrytu podél šňůry.' }

# ── Modul C2: Full Cave ──────────────────────────────────────────────────────
- { id: smerova-sipka, label: Směrová šipka, type: equipment, moduleId: fullcave, shortDefinition: 'Trvalá značka na šňůře ukazující směr k nejbližšímu východu.' }
- { id: osobni-znacka, label: Osobní značka, type: equipment, moduleId: fullcave, shortDefinition: 'Značka, kterou si potápěč označí šňůru vedoucí k jeho vlastnímu východu; cestou ven ji sbírá.' }
- { id: skok, label: Skok, type: procedure, moduleId: fullcave, shortDefinition: 'Přemostění mezery mezi dvěma šňůrami vlastní cívkou, aby šňůra k východu zůstala souvislá.' }
- { id: mezera-ve-snure, label: Mezera ve šňůře, type: risk, moduleId: fullcave, shortDefinition: 'Úsek bez šňůry mezi dvěma trvalými šňůrami nebo mezi šňůrou a otevřenou vodou.' }
- { id: rozcesti-t, label: Rozcestí T, type: risk, moduleId: fullcave, shortDefinition: 'Místo, kde se trvalé šňůry spojují; při návratu je na výběr víc směrů.' }
- { id: okruh-a-traverz, label: Okruh a traverz, type: procedure, moduleId: fullcave, shortDefinition: 'Okruh se vrací jinou cestou ke stejnému vchodu, traverz končí jiným vchodem.' }
- { id: plan-navigace, label: Plán navigace, type: procedure, moduleId: fullcave, shortDefinition: 'Před ponorem dohodnutá trasa, počet rozhodnutí a značení; pod vodou se nerozšiřuje.' }
- { id: ztrata-partnera, label: Ztráta partnera, type: risk, moduleId: fullcave, shortDefinition: 'Člen týmu není na dohled ani na dosah; hledání omezuje plyn hledajícího.' }
- { id: zuzenina, label: Zúženina, type: risk, moduleId: fullcave, shortDefinition: 'Místo, kudy dva potápěči neproplavou vedle sebe; zpomaluje, víří a komplikuje sdílení plynu.' }
- { id: proud-v-jeskyni, label: Proud v jeskyni, type: risk, moduleId: fullcave, shortDefinition: 'Průtok vody chodbou; mění poměr času cesty dovnitř a ven.' }
- { id: podil-plynu, label: Použitelný podíl plynu, type: quantity, moduleId: fullcave, formulaId: podil-plynu, shortDefinition: 'Část zásoby použitelná na cestu dovnitř, když se rychlost tam a zpět liší; nejvýš třetina.' }
- { id: skutr-dpv, label: Skútr (DPV), type: equipment, moduleId: fullcave, shortDefinition: 'Podvodní tahač; násobí dosah, a tím i vzdálenost, kterou je při poruše třeba uplavat.' }
- { id: selhani-skutru, label: Selhání skútru, type: risk, moduleId: fullcave, shortDefinition: 'Porucha tahače daleko od vchodu; návrat tažením nebo plaváním.' }
- { id: tazeni-partnera, label: Tažení partnera, type: procedure, moduleId: fullcave, shortDefinition: 'Návrat dvou potápěčů na jednom skútru; pomalejší a s vyšší spotřebou energie i plynu.' }
- { id: sidemount, label: Sidemount, type: equipment, moduleId: fullcave, shortDefinition: 'Dvě nezávislé lahve po stranách těla; nízký profil a ventily na dohled.' }

# ── Modul C3: Deep Cave ──────────────────────────────────────────────────────
- { id: hluboka-jeskyne, label: Hluboká jeskyně, type: risk, moduleId: deepcave, shortDefinition: 'Ponor, kde se sčítá strop, hloubka a dekomprese: žádný přímý výstup, vysoká spotřeba a dlouhá cesta ven.' }
- { id: profil-jeskyne, label: Profil jeskyně, type: risk, moduleId: deepcave, shortDefinition: 'Hloubku v každém místě určuje chodba, ne potápěč; pilovitý profil nutí k opakovaným sestupům a výstupům.' }
- { id: deko-v-jeskyni, label: Dekomprese v jeskyni, type: procedure, moduleId: deepcave, shortDefinition: 'Zastávky pod skalním stropem, na místech daných chodbou, často daleko od vchodu.' }
- { id: odlozeni-stage, label: Odložení stage lahve, type: procedure, moduleId: deepcave, shortDefinition: 'Lahev se po vydýchání dohodnutého podílu zanechá na šňůře a cestou ven se sbírá.' }
- { id: plyn-ze-stage, label: Použitelný plyn ze stage, type: quantity, moduleId: deepcave, shortDefinition: 'Podíl stage lahve použitelný cestou dovnitř; zbytek spolu se zásobou na zádech kryje cestu ven.' }
- { id: ztrata-stage, label: Ztráta stage lahve, type: risk, moduleId: deepcave, shortDefinition: 'Odložená lahev není k nalezení nebo nefunguje; chybí plyn, se kterým plán počítal.' }
- { id: habitat, label: Dekompresní habitat, type: equipment, moduleId: deepcave, shortDefinition: 'Suchý prostor pod vodou pro dlouhou dekompresi: teplo, jídlo a menší následky kyslíkových křečí.' }
- { id: plan-hluboke-jeskyne, label: Plán hlubokého jeskynního ponoru, type: procedure, moduleId: deepcave, shortDefinition: 'Spojuje směsi, dekompresi, navigaci a plyn na cestu ven pro dva do jednoho plánu s jedním nejslabším článkem.' }
