- id: hranicka-propast
  text: >-
    Nejhlubší známá zatopená propast světa je sladkovodní – Hranická propast na Moravě.
    Dálkově řízený robot v ní v roce 2016 dosáhl hloubky 404 m a dna se nedotkl.
    Ve sladké vodě by tam absolutní tlak byl kolem 40 bar.
  conceptIds: [hloubka, absolutni-tlak]
  source: { title: Hranická propast – průzkum ROV 2016, author: 'Česká speleologická společnost, ZO 7-02 Hranický kras', year: 2016, note: Hloubku a rok ověřit proti primárnímu zdroji. }
  needs_review: true

- id: boyle-1662
  text: >-
    Robert Boyle publikoval vztah mezi tlakem a objemem vzduchu roku 1662 po pokusech se rtutí v zahnuté skleněné trubici.
    Ve Francii se stejný zákon učí jako Mariottův – Edme Mariotte k němu došel nezávisle o několik let později.
  conceptIds: [vzorec-boyle]
  source: { title: 'A Defence of the Doctrine Touching the Spring and Weight of the Air', author: Robert Boyle, year: 1662 }

- id: hustota-anthony-mitchell
  text: >-
    Doporučení držet hustotu dýchaného plynu pod 5,2 g/l a nikdy nepřekročit 6,2 g/l pochází z rozboru testů dýchacích přístrojů,
    který v roce 2016 publikovali Gavin Anthony a Simon Mitchell. Nad horní hranicí prudce přibývalo testů ukončených nebezpečným hromaděním CO2.
  conceptIds: [hustota-plynu, prace-dychani, retence-co2]
  source: { title: 'Respiratory physiology of rebreather diving. In: Rebreathers and Scientific Diving', author: 'Anthony G., Mitchell S. J.', year: 2016 }

- id: dalton-1801
  text: >-
    John Dalton, učitel z Manchesteru a autor atomové teorie, formuloval zákon parciálních tlaků roku 1801.
    Byl také první, kdo vědecky popsal barvoslepost – trpěl jí sám a dodnes se jí podle něj říká daltonismus.
  conceptIds: [vzorec-dalton, parcialni-tlak]
  source: { title: Zákon parciálních tlaků, author: John Dalton, year: 1801 }

- id: haldane-kozy
  text: >-
    První dekompresní tabulky vznikly z pokusů na kozách. John Scott Haldane s kolegy je v letech 1905–1907 vystavoval tlaku v komoře
    a zjistil, že pokles tlaku na polovinu snášejí bez příznaků. Tabulky publikované roku 1908 převzalo britské námořnictvo.
  conceptIds: [syceni-tkani, dcs]
  source: { title: The Prevention of Compressed-Air Illness, author: 'Boycott A. E., Damant G. C. C., Haldane J. S.', year: 1908, note: Journal of Hygiene 8(3) }

- id: horka-lahev
  text: >-
    Při rychlém plnění se lahev ohřeje klidně na 40–50 °C. Proto plnírny lahve chladí ve vodní lázni nebo plní pomalu:
    „dvě stě barů“ na teplé lahvi ve studené vodě znamená citelně méně.
  conceptIds: [teplota, tlak-v-lahvi]
  source: { title: 'NOAA Diving Manual, 6th Edition – Physics of Diving', author: NOAA, year: 2017 }

- id: archimedes
  text: >-
    Archimédův zákon je přes 2200 let starý a pro potápěče platí beze změny: nadnáší tě síla rovná tíze vody, kterou vytlačíš.
    V moři je to asi o 3 % víc než ve sladké vodě – proto v jezeře potřebuješ méně olova.
  conceptIds: [vztlak]
  source: { title: O plovoucích tělesech, author: Archimédés ze Syrakus, note: 3. století př. n. l. }

- id: zvuk-ve-vode
  text: >-
    Zvuk se ve vodě šíří rychlostí kolem 1500 m/s, tedy víc než čtyřikrát rychleji než ve vzduchu.
    Mozek určuje směr podle zpoždění mezi ušima – a to je pod vodou tak krátké, že zvuk zní, jako by přicházel odevšad.
  conceptIds: [ztrata-tepla]
  source: { title: 'U.S. Navy Diving Manual, Revision 7 – Underwater Physics', author: Naval Sea Systems Command, year: 2016 }

- id: lanphier-co2
  text: >-
    Edward Lanphier při pokusech pro americké námořnictvo v 50. letech zjistil, že někteří potápěči při práci pod tlakem
    dýchají méně, než by měli, a hromadí CO2, aniž to cítí. Dostali název „CO2 retainers“ a ukázalo se, že mají vyšší riziko kyslíkových křečí.
  conceptIds: [retence-co2, cns-toxicita]
  source: { title: 'Nitrogen-Oxygen Mixture Physiology, Phases 1–6', author: 'Lanphier E. H., US Navy Experimental Diving Unit', year: 1955, note: Rok a přesný název zprávy ověřit. }
  needs_review: true

- id: hemoglobin
  text: >-
    Gram hemoglobinu naváže asi 1,34 ml kyslíku a na hladině je nasycený z 97–98 %. Dýchání čistého kyslíku proto hemoglobinu skoro nic nepřidá –
    přibude jen kyslík fyzikálně rozpuštěný v plazmě. Právě ten je podstatou hyperbarické léčby.
  conceptIds: [transport-kysliku]
  source: { title: 'Bennett and Elliott''s Physiology and Medicine of Diving, 5th Edition', author: 'Brubakk A. O., Neuman T. S. (eds.)', year: 2003 }

- id: valsalva
  text: >-
    Manévr, kterým si většina potápěčů vyrovnává uši, popsal italský anatom Antonio Maria Valsalva roku 1704 –
    původně jako způsob, jak z ucha vypudit hnis. Šetrnější Frenzelův manévr vymyslel až za druhé světové války lékař Luftwaffe pro piloty střemhlavých bombardérů.
  conceptIds: [vyrovnani-tlaku]
  source: { title: De aure humana tractatus, author: Antonio Maria Valsalva, year: 1704, note: Údaj o Frenzelovi ověřit. }
  needs_review: true

- id: nitrox-rutkowski
  text: >-
    Nitrox používala americká NOAA pro vědecké potápěče od 70. let; standardní směs NOAA Nitrox I měla 32 % kyslíku.
    Rekreačním potápěčům ho roku 1985 zpřístupnil bývalý šéf potápění NOAA Dick Rutkowski. Část oboru tehdy nitrox nazývala „ďáblovým plynem“.
  conceptIds: [nitrox]
  source: { title: 'NOAA Diving Manual, 6th Edition – Nitrox Diving', author: NOAA, year: 2017, note: Rok 1985 a založení IAND ověřit. }
  needs_review: true

- id: paul-bert
  text: >-
    Křeče z kyslíku pod tlakem popsal francouzský fyziolog Paul Bert roku 1878 v knize La Pression barométrique.
    Toxicitě kyslíku pro centrální nervový systém se proto dodnes říká efekt Paula Berta.
  conceptIds: [cns-toxicita]
  source: { title: La Pression barométrique, author: Paul Bert, year: 1878 }

- id: noaa-limity
  text: >-
    Tabulka limitů, podle které se počítají CNS hodiny, je z NOAA Diving Manual. Nejde o ostrou hranici mezi bezpečím a křečemi,
    ale o provozní limity odvozené z praxe a pokusů – tolerance kyslíku se liší mezi lidmi i ze dne na den.
  conceptIds: [vzorec-cns, cns-toxicita]
  source: { title: 'NOAA Diving Manual, 6th Edition – Oxygen Exposure Limits', author: NOAA, year: 2017 }

- id: lorrain-smith
  text: >-
    Poškození plic dlouhodobým dýcháním kyslíku popsal roku 1899 skotský patolog James Lorrain Smith.
    Plicní toxicitě se proto říká efekt Lorraina Smithe – na rozdíl od efektu Paula Berta nastupuje pomalu, během hodin až dnů.
  conceptIds: [plicni-toxicita]
  source: { title: The pathological effects due to increase of oxygen tension in the air breathed, author: 'Lorrain Smith J.', year: 1899, note: Journal of Physiology 24(1) }

- id: ead-tabulky
  text: >-
    Než se rozšířily potápěčské počítače, byla EAD jediný praktický způsob, jak s nitroxem plánovat:
    potápěč spočítal ekvivalentní hloubku a pak použil obyčejné vzduchové tabulky. Dnešní počítač dělá totéž – jen průběžně.
  conceptIds: [vzorec-ead]
  source: { title: 'NOAA Diving Manual, 6th Edition – Nitrox Diving', author: NOAA, year: 2017 }

- id: standardni-smesi
  text: >-
    Některé agentury místo počítání best mixu pro každý ponor používají malou sadu standardních směsí, například EAN32 do 30 m.
    Argument: tým má vždy stejný plyn, stejné MOD a stejnou dekompresi – a méně příležitostí k chybě.
  conceptIds: [vzorec-best-mix, nitrox]
  source: { title: 'GUE Standards and Procedures – standard gases', author: Global Underwater Explorers, note: Aktuální verzi standardů ověřit. }
  needs_review: true

- id: behnke-okno
  text: >-
    Pojem kyslíkové okno zavedl roku 1967 Albert Behnke, lékař amerického námořnictva. Jiní autoři stejný jev nazývají
    „inherent unsaturation“ (Hills) nebo „partial pressure vacancy“ (Momsen) – tři jména pro totéž.
  conceptIds: [kyslikove-okno]
  source: { title: The isobaric (oxygen window) principle of decompression, author: 'Behnke A. R.', year: 1967 }

- id: galvanicky-clanek
  text: >-
    Čidlo v analyzátoru je malý galvanický článek: kyslík v něm reaguje a vyrábí proud úměrný svému parciálnímu tlaku.
    Článek se tím spotřebovává – vydrží obvykle jeden až tři roky a ke konci života měří nízko nebo nestabilně.
  conceptIds: [analyzator-kysliku]
  source: { title: 'NOAA Diving Manual, 6th Edition – Nitrox Diving', author: NOAA, year: 2017 }

- id: kyslik-na-deku
  text: >-
    Dekomprese na čistém kyslíku není vynález technického potápění. Americké námořnictvo ji zkoušelo už ve 30. letech
    a kyslíkové dekompresní tabulky pro povrchovou dekompresi v komoře používá dodnes.
  conceptIds: [ean50, kyslikove-okno]
  source: { title: 'U.S. Navy Diving Manual, Revision 7', author: Naval Sea Systems Command, year: 2016, note: Dataci prvních pokusů ověřit. }
  needs_review: true

- id: adiabaticke-ohrati
  text: >-
    Dieselový motor nemá svíčky – směs v něm zapálí samotné stlačení vzduchu. Stejný jev nastane v hadici nebo v prvním stupni,
    když prudce otevřeš ventil lahve. Proto se ventily kyslíkových lahví otevírají vždy pomalu.
  conceptIds: [kyslikovy-pozar, kyslikova-cistota]
  source: { title: 'ASTM G88 – Standard Guide for Designing Systems for Oxygen Service', author: ASTM International }

- id: realny-plyn
  text: >-
    Skutečné plyny se při 200 barech nechovají přesně podle ideální rovnice: kyslík a dusík jsou o něco méně stlačitelné, než teorie říká.
    U nitroxu je odchylka malá, u trimixu s heliem už znatelná – proto míchači používají tabulky stlačitelnosti a výsledek vždy analyzují.
  conceptIds: [michani-parcialnim-tlakem, analyza-plynu]
  source: { title: 'NOAA Diving Manual, 6th Edition – Gas Mixing', author: NOAA, year: 2017 }

- id: buhlmann-keller
  text: >-
    Albert Bühlmann vyvíjel své tabulky v curyšské univerzitní nemocnici od konce 50. let. Proslavil je matematik Hannes Keller,
    který s nimi v roce 1962 sestoupil ve zvonu na 300 metrů. Sada koeficientů ZHL-16 vyšla knižně roku 1983 a dodnes je základem většiny potápěčských počítačů.
  conceptIds: [model-buhlmann]
  source: { title: Dekompression – Dekompressionskrankheit, author: 'Bühlmann A. A.', year: 1983, note: Údaje o Kellerově ponoru ověřit. }
  needs_review: true

- id: workman-m
  text: >-
    Pojem M-hodnota zavedl roku 1965 Robert Workman, lékař amerického námořnictva. „M“ znamená maximum.
    Haldane počítal se stálým poměrem tlaků 2 : 1; Workman ukázal, že přípustné přesycení se liší podle kompartmentu a roste s hloubkou.
  conceptIds: [m-hodnota]
  source: { title: Calculation of decompression schedules for nitrogen-oxygen and helium-oxygen dives. NEDU Research Report 6-65, author: 'Workman R. D.', year: 1965 }

- id: baker-gf
  text: >-
    Gradient factors nevymyslel lékař, ale inženýr. Erik Baker je popsal koncem 90. let v článcích pro technické potápěče
    a zdrojový kód svého programu zveřejnil. Díky tomu se GF staly standardem, kterému rozumí každý počítač i plánovač.
  conceptIds: [gradient-factor]
  source: { title: 'Understanding M-values; Clearing Up the Confusion About Deep Stops', author: 'Baker E. C.', year: 1998 }

- id: spencer-doppler
  text: >-
    Že bubliny vznikají i po „bezpečných“ ponorech, ukázal ultrazvuk. Merrill Spencer v 70. letech Dopplerovým detektorem slyšel bubliny
    v žilní krvi potápěčů bez jakýchkoli příznaků. Jeho stupnice 0–IV se k hodnocení množství bublin používá dodnes.
  conceptIds: [bubliny]
  source: { title: 'Decompression limits for compressed air determined by ultrasonically detected blood bubbles. Journal of Applied Physiology 40(2)', author: 'Spencer M. P.', year: 1976 }

- id: rychlost-vystupu-historie
  text: >-
    Rychlost výstupu 18 m/min, se kterou vyrostly generace potápěčů, vznikla jako kompromis: lehcí potápěči chtěli stoupat rychleji, přilbáři to nestíhali.
    Americké námořnictvo ji později snížilo na 9 m/min, když se ukázalo, že pomalejší výstup snižuje počet bublin.
  conceptIds: [rychlost-vystupu]
  source: { title: 'U.S. Navy Diving Manual, Revision 7', author: Naval Sea Systems Command, year: 2016, note: Historii a rok změny ověřit. }
  needs_review: true

- id: spotreba-stres
  text: >-
    Vlastní spotřebu většina potápěčů podceňuje, protože ji zná z klidných ponorů. Při silném stresu může ventilace vyskočit na několikanásobek –
    proto se rezervy počítají se stresovou, ne s průměrnou spotřebou.
  conceptIds: [sac, namaha]
  source: { title: 'NOAA Diving Manual, 6th Edition – Air Consumption', author: NOAA, year: 2017 }

- id: minimum-gas-nazvy
  text: >-
    Stejná rezerva má několik jmen: rock bottom, minimum gas, kritický tlak. Liší se i detaily výpočtu mezi agenturami –
    čas na řešení problému, rychlost výstupu, zastávky. Podstata je vždy stejná: dva lidé, jeden zdroj plynu, nejhlubší bod ponoru.
  conceptIds: [minimum-gas]
  source: { title: GUE Standards and Procedures – minimum gas, author: Global Underwater Explorers, note: Aktuální verzi standardů ověřit. }
  needs_review: true

- id: tretiny-exley
  text: >-
    Pravidlo třetin vzešlo z rozborů smrtelných nehod ve floridských jeskyních. Sheck Exley je roku 1979 zařadil mezi základní pravidla
    v útlé knížce Basic Cave Diving: A Blueprint for Survival – každé pravidlo v ní je vykoupené konkrétními nehodami.
  conceptIds: [pravidlo-tretin]
  source: { title: 'Basic Cave Diving: A Blueprint for Survival', author: 'Exley S.', year: 1979 }

- id: vzduchove-prestavky
  text: >-
    Při dlouhé dekompresi na kyslíku předepisují tabulky amerického námořnictva pravidelné přestávky na vzduchu: po každých 30 minutách kyslíku 5 minut vzduchu.
    Přestávka sníží riziko kyslíkových křečí a do času dekomprese se nezapočítává.
  conceptIds: [deko-zastavka, cns-toxicita]
  source: { title: 'U.S. Navy Diving Manual, Revision 7 – Air Decompression', author: Naval Sea Systems Command, year: 2016, note: Přesné intervaly ověřit. }
  needs_review: true

- id: hlinikova-osmdesatka
  text: >-
    Nejrozšířenější potápěčská lahev na světě je hliníková „osmdesátka“ o objemu 11,1 l. Jako stage je oblíbená proto, že je ve vodě téměř neutrální:
    plná lehce táhne dolů, prázdná lehce nadnáší.
  conceptIds: [stage-lahev, vztlak]
  source: { title: 'NOAA Diving Manual, 6th Edition – Diving Equipment', author: NOAA, year: 2017 }

- id: hogarthian
  text: >-
    Minimalistická konfigurace s dvojčetem, dlouhou hadicí a záložní automatikou na gumičce pod bradou nese jméno floridského jeskyňáře Williama Hogartha Maina.
    Jeho zásada: co nepotřebuješ, neber; co potřebuješ, měj vždy na stejném místě.
  conceptIds: [twinset]
  source: { title: 'Doing It Right: The Fundamentals of Better Diving', author: 'Jablonski J.', year: 2006, note: Původ názvu ověřit. }
  needs_review: true

- id: vynechana-deko-postupy
  text: >-
    Vynechaná dekomprese má v příručkách námořnictev i agentur vlastní kapitolu s postupy podle toho, jak hluboké zastávky chybějí a zda má potápěč příznaky.
    Společný jmenovatel: kyslík, klid, tekutiny, sledování a včasný kontakt s hyperbarickým lékařem.
  conceptIds: [vynechana-dekomprese]
  source: { title: 'U.S. Navy Diving Manual, Revision 7 – Omitted Decompression', author: Naval Sea Systems Command, year: 2016 }

- id: checklist-b17
  text: >-
    Kontrolní seznamy přišly z letectví. V roce 1935 havaroval prototyp bombardéru Boeing, protože zkušená posádka zapomněla odjistit řízení.
    Letadlo nebylo příliš složité na pilotování – jen příliš složité na paměť jednoho člověka. Řešením byl list papíru.
  conceptIds: [plan-ponoru, tym]
  source: { title: The Checklist Manifesto, author: 'Gawande A.', year: 2009 }

- id: squalus-helium
  text: >-
    Helium v dýchací směsi poprvé zachraňovalo životy roku 1939. Když se u pobřeží Nové Anglie potopila ponorka USS Squalus do 74 metrů,
    potápěči amerického námořnictva při vyprošťování použili helioxové směsi, které do té doby existovaly jen v pokusech.
  conceptIds: [helium, hluboky-vzduch]
  source: { title: 'U.S. Navy Diving Manual, Revision 7 – History of Diving', author: Naval Sea Systems Command, year: 2016, note: Hloubku ověřit. }
  needs_review: true

- id: meyer-overton
  text: >-
    Kolem roku 1900 si Hans Meyer a Charles Overton nezávisle všimli, že narkotický účinek látky roste s její rozpustností v tucích.
    Pravidlo dobře vysvětluje pořadí helium – dusík – argon. Právě podle něj by měl být kyslík narkotičtější než dusík.
  conceptIds: [dusikova-narkoza, narkoticnost-kysliku]
  source: { title: "Bennett and Elliott's Physiology and Medicine of Diving, 5th Edition – Inert Gas Narcosis", author: 'Bennett P. B., Rostain J. C.', year: 2003 }

- id: opojeni-hlubinou
  text: >-
    Jacques-Yves Cousteau nazval narkózu „opojení velkých hloubek“. V knize Svět ticha popisuje, jak jeho kolega Frédéric Dumas
    při pokusném sestupu na vzduchu podepsal tabulku v 62 metrech a později si z toho pamatoval jen zlomky.
  conceptIds: [dusikova-narkoza, hluboky-vzduch]
  source: { title: 'Le Monde du silence (Svět ticha)', author: 'Cousteau J.-Y., Dumas F.', year: 1953, note: Hloubku a podrobnosti ověřit. }
  needs_review: true

- id: hlas-na-heliu
  text: >-
    „Kačeří“ hlas po nadechnutí helia nezpůsobuje změna hlasivek. Zvuk se v heliu šíří téměř třikrát rychleji než ve vzduchu
    a dutiny úst a hrtanu proto rezonují na vyšších tónech. Saturační potápěči používají elektronické korektory řeči.
  conceptIds: [helium]
  source: { title: 'U.S. Navy Diving Manual, Revision 7 – Mixed Gas Diving', author: Naval Sea Systems Command, year: 2016 }

- id: argon-v-obleku
  text: >-
    Argon vede teplo asi o třetinu hůř než vzduch, a proto si ho někteří potápěči plní do suchého obleku z malé samostatné lahve.
    Měřený přínos je menší, než by odpovídalo teorii – záleží hlavně na tom, zda se z obleku vzduch předem vypláchne.
  conceptIds: [argon, ztrata-tepla]
  source: { title: 'Argon used as dry suit insulation gas for cold-water diving. Extreme Physiology & Medicine 2:17', author: 'Vrijdag X. C. E. et al.', year: 2013, note: Závěr studie ověřit. }
  needs_review: true

- id: atlantis-hpns
  text: >-
    Nervový syndrom vysokého tlaku zkoumal Peter Bennett na Dukeově univerzitě. V sérii pokusů Atlantis kolem roku 1980 dosáhli dobrovolníci v komoře
    tlaku odpovídajícího 686 metrům. Pomohlo přidat do helia trochu dusíku: jeho narkotický účinek třes tlumí.
  conceptIds: [hpns]
  source: { title: "Bennett and Elliott's Physiology and Medicine of Diving, 5th Edition – The High Pressure Nervous Syndrome", author: 'Bennett P. B., Rostain J. C.', year: 2003, note: Hloubku a rok ověřit. }
  needs_review: true

- id: helium-cena
  text: >-
    Helium se nevyrábí, těží se: je vedlejším produktem zpracování zemního plynu a vzniklo radioaktivním rozpadem v zemské kůře.
    Co unikne do atmosféry, je pro Zemi ztraceno. Proto je trimix drahý a proto se u velkých ponorů prosadily rebreathery.
  conceptIds: [helium, trimix]
  source: { title: 'Mineral Commodity Summaries – Helium', author: U.S. Geological Survey }

- id: nedu-heliox-trimix
  text: >-
    Dlouho se věřilo, že dusík v trimixu dekompresi oproti helioxu urychluje. Pokus amerického námořnictva z roku 2015 srovnal oba plyny na stejném profilu
    a rozdíl nenašel. Dekompresní modely přitom s heliem stále počítají jinak než s dusíkem.
  conceptIds: [deko-s-heliem, difuze-helia]
  source: { title: 'Decompression from He-N2-O2 (trimix) bounce dives is not more efficient than from He-O2 (heliox) bounce dives. NEDU TR 15-04', author: 'Doolette D. J., Gault K. A., Gerth W. A.', year: 2015 }
  needs_review: true

- id: analyzator-helia
  text: >-
    Podíl helia se měří jinak než kyslík. Analyzátory využívají buď jeho vysokou tepelnou vodivost, nebo rychlost zvuku ve směsi –
    obojí se u helia výrazně liší od dusíku i kyslíku.
  conceptIds: [analyza-helia]
  source: { title: 'TDI Trimix Diver Manual', author: Technical Diving International }

- id: posledni-ponor
  text: >-
    Kniha Bernieho Chowdhuryho The Last Dive popisuje komunitu vrakových potápěčů na východním pobřeží USA začátkem 90. let,
    kdy byl trimix nový, drahý a mnohými odmítaný. Právě tehdejší nehody na vzduchu přispěly k tomu, že se helium stalo samozřejmostí.
  conceptIds: [hluboky-vzduch, trimix]
  source: { title: The Last Dive, author: 'Chowdhury B.', year: 2000 }

- id: hypoxie-bez-varovani
  text: >-
    Piloti se v podtlakové komoře učí poznat vlastní hypoxii, protože přichází jako příjemná otupělost, ne jako dušení.
    Potápěč tuto možnost nemá: na hypoxické směsi u hladiny dělí první nádech od bezvědomí často jen desítky vteřin.
  conceptIds: [hypoxicka-smes, hypoxie]
  source: { title: "Bennett and Elliott's Physiology and Medicine of Diving, 5th Edition", author: 'Brubakk A. O., Neuman T. S. (eds.)', year: 2003 }

- id: travel-nazev
  text: >-
    Jako travel gas často poslouží směs, kterou má potápěč stejně s sebou: dekompresní plyn pro hluboké zastávky.
    Jedna lahev tak kryje sestup i část výstupu – a právě proto musí mít jednoznačně napsanou MOD pro obě cesty.
  conceptIds: [travel-gas]
  source: { title: 'TDI Advanced Trimix Diver Manual', author: Technical Diving International }

- id: lambertsen-icd
  text: >-
    Izobarickou protidifuzi popsal v 70. letech Christian Lambertsen. Dobrovolníci v komoře dýchali směs s dusíkem, zatímco byli obklopeni heliem –
    a na kůži se jim udělaly svědivé pupeny, aniž se tlak změnil. Stejný Lambertsen o čtvrt století dřív vymyslel zkratku SCUBA.
  conceptIds: [icd]
  source: { title: 'A new gas lesion syndrome in man, induced by isobaric gas counterdiffusion. Journal of Applied Physiology 39(3)', author: 'Lambertsen C. J., Idicula J.', year: 1975 }

- id: ucho-doolette
  text: >-
    Proč zrovna vnitřní ucho? David Doolette a Simon Mitchell v roce 2003 spočítali, že jeho tekutiny jsou malé, špatně prokrvené a helia se zbavují pomalu.
    Při dekompresi hlubokého ponoru tak v uchu vzniká přesycení větší než v mozku – a přepnutí plynu ho může na chvíli ještě zvýšit.
  conceptIds: [dcs-vnitrniho-ucha, icd]
  source: { title: 'Biophysical basis for inner ear decompression sickness. Journal of Applied Physiology 94(6)', author: 'Doolette D. J., Mitchell S. J.', year: 2003 }
  needs_review: true

- id: pyle-zastavky
  text: >-
    Hluboké zastávky zpopularizoval ichtyolog Richard Pyle. Při lovu ryb v hloubkách přes 60 m si všiml, že se po ponoru cítí lépe,
    když cestou nahoru zastaví, aby rybám vypustil plynový měchýř. Z osobní zkušenosti se během 90. let stalo pravidlo – dřív, než je kdokoli ověřil pokusem.
  conceptIds: [hluboke-zastavky]
  source: { title: 'The importance of deep safety stops: rethinking ascent patterns from decompression dives. DeepTech 5', author: 'Pyle R. L.', year: 1996 }

- id: rekord-oc
  text: >-
    Nejhlubší ponor na otevřeném okruhu, 332 metrů, uskutečnil roku 2014 v Rudém moři Ahmed Gabr. Sestup trval čtvrt hodiny, výstup téměř čtrnáct hodin
    a o plyn se staraly desítky lahví a podpůrný tým. Je to dobrá ilustrace toho, kde otevřený okruh končí.
  conceptIds: [limit-otevreneho-okruhu, podpurny-tym]
  source: { title: Guinness World Records – deepest scuba dive (male), year: 2014, note: Hloubku a časy ověřit. }
  needs_review: true

- id: repex-hamilton
  text: >-
    Metodu REPEX vytvořil koncem 80. let fyziolog Bill Hamilton pro vědecké potápěče NOAA pracující z podmořského habitatu.
    Tentýž Hamilton počítal dekompresní tabulky pro první průzkumné trimixové ponory v jeskyních.
  conceptIds: [kyslik-vice-dni]
  source: { title: 'Tolerating exposure to high oxygen levels: Repex and other methods. Marine Technology Society Journal 23(4)', author: 'Hamilton R. W.', year: 1989 }

- id: teplo-nedu
  text: >-
    Pokus amerického námořnictva z roku 2007 nechal potápěče absolvovat stejný ponor ve vodě různé teploty. Nejhůř dopadli ti, kdo byli na dně v teple a na dekompresi v chladu.
    Nejlépe opačná kombinace – chladno na dně, teplo při výstupu. Rozdíl odpovídal mnoha minutám dekomprese navíc.
  conceptIds: [tepelny-management, aktivni-ohrev]
  source: { title: 'The influence of thermal exposure on diver susceptibility to decompression sickness. NEDU TR 06-07', author: 'Gerth W. A., Ruterbusch V. L., Long E. T.', year: 2007 }
  needs_review: true

- id: habitat-deko
  text: >-
    Při průzkumu dlouhých jeskynních systémů si týmy stavějí pod vodou dekompresní habitaty – zvony se vzduchovou kapsou, kde potápěč může sundat masku, najíst se a zahřát.
    Mnohahodinová dekomprese se tak změní z boje s chladem na čekání.
  conceptIds: [odlozeny-plyn, tepelny-management]
  source: { title: 'Doing It Right: The Fundamentals of Better Diving', author: 'Jablonski J.', year: 2006 }

- id: cedule-smrtka
  text: >-
    U vchodů do floridských jeskyní stojí pod vodou cedule se zubatou a nápisem: „V této jeskyni není nic, kvůli čemu by stálo za to zemřít.“
    Nainstalovali ji jeskynní potápěči pro ty, kdo sem doplavou s jednou lahví a jednou svítilnou. Od té doby počet nehod nevycvičených potápěčů klesl.
  conceptIds: [prostredi-se-stropem, pet-pravidel]
  source: { title: NSS Cave Diving Manual, author: 'Prosser J., Grey H. V. (eds.), National Speleological Society Cave Diving Section', year: 1992, note: Přesné znění a údaj o poklesu nehod ověřit. }
  needs_review: true

- id: exley-rozbor
  text: >-
    Sheck Exley prošel záznamy o smrtelných nehodách ve floridských jeskyních a zjistil, že se v nich stále opakuje několik stejných chyb.
    Většina obětí neměla žádný jeskynní výcvik – často šlo o zkušené potápěče, a dokonce instruktory z otevřené vody.
  conceptIds: [pet-pravidel]
  source: { title: 'Basic Cave Diving: A Blueprint for Survival', author: 'Exley S.', year: 1979 }

- id: snura-uzly
  text: >-
    Jeskynní šňůra bývá bílá a po celé délce značená uzly v pravidelných rozestupech. Uzly neslouží k držení –
    díky nim se dá vzdálenost měřit hmatem a při mapování počítat.
  conceptIds: [vodici-snura, navijak]
  source: { title: NSS Cave Diving Manual, author: 'Prosser J., Grey H. V. (eds.)', year: 1992 }

- id: svetlo-led
  text: >-
    První jeskynní potápěči nosili světla s olověnými akumulátory velikosti cihly a žárovkou, která vydržela desítky minut.
    Dnešní hlavní svítilna svítí několik hodin – a pravidlo tří světel přesto platí beze změny, protože selhat může vypínač, kabel i těsnění.
  conceptIds: [tri-svetla, selhani-svetla]
  source: { title: 'Caverns Measureless to Man', author: 'Exley S.', year: 1994 }

- id: dotyk-poradi
  text: >-
    Při návratu v nulové viditelnosti plave první ten, kdo má problém – například potápěč bez plynu na dlouhé hadici.
    Dárce je za ním, drží ho za paži nebo nohu a tlakem řídí tempo. Slabší článek tak udává rychlost a nemůže zůstat pozadu.
  conceptIds: [kontaktni-komunikace, sdileni-plynu]
  source: { title: 'TDI Cavern and Intro to Cave Diver Manual', author: Technical Diving International, note: 'Pořadí a úchopy se mezi agenturami liší.' }
  needs_review: true

- id: jil-hodiny
  text: >-
    Nejjemnější jíl se v klidné vodě usazuje celé hodiny, někdy dny. Chodba, kterou tým zvířil cestou dovnitř, tak může být při návratu neprůhledná –
    a zůstane taková i pro ty, kdo přijdou po něm.
  conceptIds: [sediment, nulova-viditelnost]
  source: { title: NSS Cave Diving Manual, author: 'Prosser J., Grey H. V. (eds.)', year: 1992 }

- id: zabi-kop-puvod
  text: >-
    Žabí kop není vynález jeskyňářů; je to záběr nohou z prsou. Jeskynní potápěči ho převzali, protože voda od ploutví odchází dozadu a vzhůru, ne ke dnu.
    Dnes ho učí i kurzy pro otevřenou vodu – šetří síly a korály.
  conceptIds: [zabi-kop]
  source: { title: 'Doing It Right: The Fundamentals of Better Diving', author: 'Jablonski J.', year: 2006 }

- id: tretiny-nestaci
  text: >-
    Pravidlo třetin počítá s tím, že cesta ven trvá stejně dlouho jako dovnitř a že se nic dalšího nepokazí. Proud do jeskyně, zvířený sediment nebo dva zadýchaní lidé na jedné lahvi to mění.
    Proto zkušené týmy v náročných jeskyních otáčejí dřív – na čtvrtině nebo šestině.
  conceptIds: [tlak-otocky, pravidlo-tretin]
  source: { title: NSS Cave Diving Manual, author: 'Prosser J., Grey H. V. (eds.)', year: 1992 }

- id: ztracena-snura-statistika
  text: >-
    Ztráta šňůry málokdy znamená, že šňůra zmizela. Bývá půl metru daleko. Zabíjí to, co potápěč udělá v prvních vteřinách:
    vyrazí naslepo směrem, kde si myslí, že je východ.
  conceptIds: [ztrata-snury, nulova-viditelnost]
  source: { title: 'Basic Cave Diving: A Blueprint for Survival', author: 'Exley S.', year: 1979 }

- id: sipky-puvod
  text: >-
    Směrové šipky, kulaté „cookies“ i obdélníkové značky REM vymysleli jeskynní potápěči na Floridě jako odpověď na konkrétní nehody na rozcestích.
    Šipka je záměrně hmatatelná: její směr se dá přečíst v rukavicích a poslepu.
  conceptIds: [smerova-sipka, osobni-znacka]
  source: { title: NSS Cave Diving Manual, author: 'Prosser J., Grey H. V. (eds.)', year: 1992, note: 'Autory jednotlivých značek a roky ověřit.' }
  needs_review: true

- id: zlata-snura
  text: >-
    V řadě floridských systémů je hlavní šňůra zlatá a boční šňůry bílé a od hlavní oddělené mezerou. Mezera je záměr:
    kdo neumí položit skok, na boční šňůru se omylem nedostane. V jiných oblastech jsou zvyklosti jiné – místní značení se zjišťuje před ponorem.
  conceptIds: [mezera-ve-snure, skok]
  source: { title: NSS Cave Diving Manual, author: 'Prosser J., Grey H. V. (eds.)', year: 1992, note: 'Místní konvence ověřit.' }
  needs_review: true

- id: mapovani-jeskyni
  text: >-
    Mapy zatopených jeskyní vznikají ručně: průzkumník měří vzdálenost podle uzlů na šňůře, směr kompasem a hloubku hloubkoměrem, stanici po stanici.
    Mapa je proto vždy starší a hrubší než jeskyně. Plán navigace se z ní připravuje, ale rozhoduje to, co je na šňůře.
  conceptIds: [plan-navigace, okruh-a-traverz]
  source: { title: NSS Cave Diving Manual, author: 'Prosser J., Grey H. V. (eds.)', year: 1992 }

- id: svetlo-ve-tme
  text: >-
    V čisté vodě je kužel svítilny vidět na desítky metrů – ale jen ve tmě. Proto první krok při hledání partnera vypadá paradoxně:
    zakrýt vlastní světlo.
  conceptIds: [ztrata-partnera, svetelne-signaly]
  source: { title: NSS Cave Diving Manual, author: 'Prosser J., Grey H. V. (eds.)', year: 1992 }

- id: haloklina
  text: >-
    V pobřežních jeskyních Yucatánu leží sladká voda na slané. Rozhraní – haloklina – vypadá nedotčené jako hladina uvnitř vody.
    Když jím tým proplave, vrstvy se promíchají a obraz se rozmaže jako přes olej. Potápěč za ním vidí hůř, i když se nezvedl žádný sediment.
  conceptIds: [nulova-viditelnost, zuzenina]
  source: { title: TDI Full Cave Diver Manual, author: Technical Diving International, note: Popis jevu ověřit. }
  needs_review: true

- id: skutr-dosah
  text: >-
    Průzkumné týmy se skútry a odloženými lahvemi pronikly v zatopených jeskyních na vzdálenosti mnoha kilometrů od vchodu.
    Na takových ponorech se neplánuje jeden skútr, ale záložní skútry a odložený plyn pro případ, že se bude muset plavat.
  conceptIds: [skutr-dpv, selhani-skutru]
  source: { title: 'Doing It Right: The Fundamentals of Better Diving', author: 'Jablonski J.', year: 2006, note: Konkrétní vzdálenosti a projekty doplnit. }
  needs_review: true

- id: sidemount-puvod
  text: >-
    Sidemount nevznikl kvůli pohodlí. Britští jeskyňáři potřebovali v suchých jeskyních donést lahve k zatopeným sifonům a pak se jimi protáhnout;
    lahve na boku byly jediná možnost. Teprve později ho převzali potápěči na Floridě a v Mexiku pro nízké chodby.
  conceptIds: [sidemount]
  source: { title: TDI Full Cave Diver Manual, author: Technical Diving International, note: Historii a dataci ověřit. }
  needs_review: true

- id: pilovity-profil
  text: >-
    Jeskyně se neptá, v jaké hloubce chceš být. Některé systémy klesnou hned za vchodem hluboko a pak stoupají;
    jiné vedou stovky metrů mělce a nejhlubší místo mají na konci. Dekompresní plán se proto nepíše pro „hloubku a čas“, ale pro konkrétní trasu.
  conceptIds: [profil-jeskyne, deko-v-jeskyni]
  source: { title: NSS Cave Diving Manual, author: 'Prosser J., Grey H. V. (eds.)', year: 1992 }

- id: stage-pruzkum
  text: >-
    Dlouhé průzkumné ponory se připravují dny předem: podpůrné týmy rozvezou lahve na dohodnutá místa a po ponoru je zase sbírají.
    Hlavní tým pak cestou dovnitř i ven lahve jen střídá. Každá má jmenovku, směs a maximální hloubku – a místo v plánu.
  conceptIds: [odlozeni-stage, podpurny-tym]
  source: { title: 'Doing It Right: The Fundamentals of Better Diving', author: 'Jablonski J.', year: 2006, note: Popis logistiky ověřit. }
  needs_review: true

- id: plyn-v-zaloze
  text: >-
    Na frekventovaných lokalitách zůstávají v jeskyních trvale uložené nouzové lahve. Plán s nimi nepočítá: nikdo neručí za to, co v nich je a kolik.
    Jediný plyn, na který se dá spolehnout, je ten, který tým sám analyzoval, označil a uložil.
  conceptIds: [ztrata-stage, analyza-plynu]
  source: { title: TDI Full Cave Diver Manual, author: Technical Diving International, note: Praxi na konkrétních lokalitách ověřit. }
  needs_review: true

- id: deko-habitat
  text: >-
    Při ponorech s mnohahodinovou dekompresí si průzkumné týmy stavějí pod stropem jeskyně habitat: obrácenou vanu nebo zvon naplněný plynem,
    do kterého se potápěč vynoří po pás nebo celý. Může se najíst, napít a ohřát – a kdyby při dýchání kyslíku přišly křeče, neutopí se.
  conceptIds: [habitat, tepelny-management]
  source: { title: 'Doing It Right: The Fundamentals of Better Diving', author: 'Jablonski J.', year: 2006, note: Konstrukci a použití ověřit. }
  needs_review: true

- id: panika-spotreba
  text: >-
    Rozbory nehod opakovaně ukazují, že potápěče nezabije první porucha, ale reakce na ni. Ztráta plynu v týmu, který ji cvičil,
    je nepříjemná minuta. V týmu, který ji necvičil, končí úprkem k hladině.
  conceptIds: [zastav-dychej-mysli, bez-plynu]
  source: { title: 'DAN Annual Diving Report (řada výročních zpráv o nehodách)', author: Divers Alert Network, note: 'Obecný závěr rozborů; konkrétní ročník doplnit.' }
  needs_review: true

- id: free-flow-zima
  text: >-
    Plyn se při snížení tlaku v prvním stupni prudce ochlazuje. Ve studené vodě může v automatice vzniknout led, který ventil podrží otevřený.
    Proto se do studené vody používají automatiky k tomu určené – a proto se z nich před ponorem na vzduchu zbytečně nedýchá.
  conceptIds: [free-flow, ztrata-tepla]
  source: { title: NOAA Diving Manual, 6th Edition, author: NOAA, year: 2017, note: Mechanismus a doporučení ověřit. }
  needs_review: true

- id: embolie-melko
  text: >-
    K poranění plic přetlakem stačí překvapivě málo. Největší poměrná změna objemu je těsně pod hladinou:
    plný nádech v několika metrech a výstup se zadrženým dechem může plíce poškodit. Proto se nezadržování dechu učí jako první pravidlo potápění.
  conceptIds: [plynova-embolie, barotrauma-plic]
  source: { title: 'U.S. Navy Diving Manual, Revision 7', author: Naval Sea Systems Command, year: 2016, note: Hloubky a mechanismus ověřit. }
  needs_review: true

- id: zachrana-doporuceni
  text: >-
    Postup záchrany bezvládného potápěče sjednotila v roce 2012 odborná komise potápěčských lékařů. Jeden z jejích závěrů zní nezvykle:
    automatiku, která potápěči vypadla z úst, se pod vodou nevyplatí vracet. Rozhoduje čas do vynoření.
  conceptIds: [bezvladny-potapec]
  source: { title: 'Recommendations for rescue of a submerged unresponsive compressed-gas diver. Undersea & Hyperbaric Medicine 39(6)', author: 'Mitchell S. J. et al.', year: 2012 }
  needs_review: true

- id: challenger-1986
  text: >-
    Pojem normalizace odchylky vznikl při rozboru zkázy raketoplánu Challenger v roce 1986. Těsnicí kroužky pomocných motorů se poškozovaly už při dřívějších letech.
    Protože každý let dopadl dobře, poškození se postupně začalo považovat za přijatelné – až do startu za mrazu, kdy těsnění selhalo.
  conceptIds: [normalizace-odchylky]
  source: { title: 'The Challenger Launch Decision: Risky Technology, Culture, and Deviance at NASA', author: 'Vaughan D.', year: 1996 }

- id: yerkes-dodson
  text: >-
    Trocha napětí výkon zlepšuje, příliš ho ničí. Vztah popsali psychologové Yerkes a Dodson už roku 1908 a platí hlavně pro složité úkoly:
    čím náročnější úkon, tím méně stresu snese. Proto se nouzové postupy cvičí tak dlouho, až přestanou být složité.
  conceptIds: [stres-zuzeni, panika]
  source: { title: 'The relation of strength of stimulus to rapidity of habit-formation. Journal of Comparative Neurology and Psychology 18', author: 'Yerkes R. M., Dodson J. D.', year: 1908, note: Výklad zákona je zjednodušený. }
  needs_review: true

- id: who-checklist
  text: >-
    Když osm nemocnic v různých zemích zavedlo před operací devatenáctibodový kontrolní seznam, počet vážných komplikací klesl zhruba o třetinu a úmrtí téměř na polovinu.
    Seznam neobsahoval nic, co by chirurgové neznali. Jen zajistil, že se to opravdu udělá pokaždé.
  conceptIds: [checklist]
  source: { title: 'A Surgical Safety Checklist to Reduce Morbidity and Mortality in a Global Population. New England Journal of Medicine 360', author: 'Haynes A. B. et al.', year: 2009, note: 'Přesná čísla (komplikace 11,0 → 7,0 %, úmrtí 1,5 → 0,8 %) ověřit.' }
  needs_review: true

- id: tenerife-1977
  text: >-
    Nejhorší nehoda v dějinách letectví, srážka dvou letadel na Tenerife roku 1977, nebyla selháním techniky. Posádka zahájila vzlet v mlze v přesvědčení,
    že má povolení; nejednoznačná věta ve vysílačce nebyla zopakována a ověřena. Letectví z ní vyvodilo standardní frázi a povinné potvrzování – uzavřenou smyčku.
  conceptIds: [uzavrena-smycka, tlak-na-dokonceni]
  source: { title: 'Tenerife airport disaster – zpráva vyšetřovací komise (souhrn)', author: 'Subsecretaría de Aviación Civil, Španělsko', year: 1978, note: Podrobnosti komunikace ověřit proti zprávě. }
  needs_review: true

- id: din-a-trmen
  text: >-
    Připojení DIN vzniklo v Německu a jeho název je zkratka Deutsches Institut für Normung. Těsnicí kroužek sedí v závitu prvního stupně a nemůže se vytlačit ven.
    U třmenového připojení je kroužek přitlačený zvenku a třmen bývá konstruovaný pro nižší plnicí tlaky než vysokotlaké DIN ventily.
  conceptIds: [din-ventil, unik-plynu]
  source: { title: 'NOAA Diving Manual, 6th Edition – Diving Equipment', author: NOAA, year: 2017, note: Tlakové třídy a normy ověřit. }
  needs_review: true
